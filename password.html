<script>
document.addEventListener("DOMContentLoaded", () => {
  const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

  const accounts = {
    "gear10": "9033",
    "luckyy1": "0226",
    "suoaztic": "4423",
    "Staff1": "1",
    "flip2": "2",
    "fork3": "3",
    "an4": "4",
    "fin5": "5"
  };

  function generateHexID() {
    const hex = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase();
    return hex.padStart(4, "0");
  }

  function getDeviceHex() {
    if (!localStorage.deviceHex) {
      localStorage.deviceHex = generateHexID();
    }
    return localStorage.deviceHex;
  }

  function sendLoginWebhook(user, code) {
    const hex = getDeviceHex();
    const fingerprint = {
      browser: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      resolution: `${window.screen.width}x${window.screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };

    const now = new Date();
    const date = now.toLocaleDateString();
    const time = now.toLocaleTimeString();

    const payload = {
      content:
`# STAFF LOGIN ALERT

**__Username__:** \`${user}\`
**__Code Used__:** \`${code}\`

**__Date__:** \`${date}\`
**__Time__:** \`${time}\`
**__Time Zone__:** \`${fingerprint.timezone}\`

**__Browser__:** \`${fingerprint.browser}\`
**__Language__:** \`${fingerprint.language}\`
**__Platform__:** \`${fingerprint.platform}\`
**__Resolution__:** \`${fingerprint.resolution}\`

**__Status__:** 
------------------------------
# \`Login Successful\`
**__Device Used__:** \`${hex}\`
User \`${hex}\` logged using \`${user}\`
Please report to founders if device isn't listed.
------------------------------`
    };

    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(() => {
      navigator.sendBeacon(webhookURL, JSON.stringify(payload));
    });
  }

  function login() {
    const user = document.getElementById("username").value.trim();
    const code = document.getElementById("code").value.trim();
    const errorBox = document.getElementById("error");

    if (!accounts[user] || accounts[user] !== code) {
      errorBox.textContent = "Invalid username or code.";
      return;
    }

    sendLoginWebhook(user, code);
    localStorage.staffLoggedIn = "true";

    // open stafflog in new tab
    window.open("stafflog.html", "_blank");
  }

  document.getElementById("loginBtn").addEventListener("click", login);
});
</script>
