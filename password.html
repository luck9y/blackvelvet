<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Log</title>

<style>
  body {
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    padding: 40px;
    text-align: center;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 30px;
  }

  .btn {
    display: block;
    width: 300px;
    margin: 15px auto;
    padding: 15px;
    background: #111;
    border: 2px solid #444;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    cursor: pointer;
  }

  .btn:hover {
    background: #222;
  }

  #blocked {
    display: none;
    margin-top: 50px;
  }

  #blocked button {
    padding: 12px 20px;
    background: #222;
    border: 2px solid #444;
    border-radius: 8px;
    color: white;
    cursor: pointer;
  }

  #blocked button:hover {
    background: #333;
  }

  #content {
    display: none;
  }
</style>
</head>

<body>

<h1>STAFF LOG</h1>

<!-- BLOCKED VIEW -->
<div id="blocked">
  <p>You must log in first.</p>
  <button onclick="window.location.href='index.html'">Return to Home</button>
</div>

<!-- REAL CONTENT -->
<div id="content">
  <button class="btn">test</button>
  <button class="btn">test</button>
  <button class="btn">test</button>
  <button class="btn">test</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // Check login flag
  const loggedIn = localStorage.staffLoggedIn === "true";

  if (loggedIn) {
    document.getElementById("content").style.display = "block";
  } else {
    document.getElementById("blocked").style.display = "block";
  }
});
</script>

</body>
</html>
