<script>
document.addEventListener("DOMContentLoaded", () => {
  // Webhook for logging (replace if you need a different one)
  const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

  // Staff accounts map (unchanged)
  const accounts = {
    "gear10": "9033",
    "luckyy1": "0226",
    "suoaztic": "4423",
    "Staff1": "1",
    "flip2": "2",
    "fork3": "3",
    "an4": "4",
    "fin5": "5"
  };

  /* ---------- Utilities ---------- */
  function generateHexID() {
    const hex = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase();
    return hex.padStart(4, "0");
  }

  function getDeviceHex() {
    if (!localStorage.deviceHex) {
      localStorage.deviceHex = generateHexID();
    }
    return localStorage.deviceHex;
  }

  function buildFingerprint() {
    return {
      browser: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      resolution: `${window.screen.width}x${window.screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }

  function sendWebhook(payloadObj) {
    const body = JSON.stringify(payloadObj);
    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body
    }).catch(() => {
      if (navigator.sendBeacon) navigator.sendBeacon(webhookURL, body);
    });
  }

  /* ---------- Webhook payloads ---------- */
  function sendLoginWebhook(user, code) {
    const hex = getDeviceHex();
    const fp = buildFingerprint();
    const now = new Date();
    const payload = {
      content:
`# STAFF LOGIN ALERT

**__Username__:** \`${user}\`
**__Code Used__:** \`${code}\`

**__Date__:** \`${now.toLocaleDateString()}\`
**__Time__:** \`${now.toLocaleTimeString()}\`
**__Time Zone__:** \`${fp.timezone}\`

**__Browser__:** \`${fp.browser}\`
**__Language__:** \`${fp.language}\`
**__Platform__:** \`${fp.platform}\`
**__Resolution__:** \`${fp.resolution}\`

**__Status__:** 
------------------------------
\`Login Successful\`
**__Device Used__:** \`${hex}\`
User \`${hex}\` logged using \`${user}\`
------------------------------`
    };
    sendWebhook(payload);
  }

  function sendFailedAttemptWebhook(userAttempt, codeAttempt, reason = "Invalid credentials") {
    const hex = getDeviceHex();
    const fp = buildFingerprint();
    const now = new Date();
    const payload = {
      content:
`# STAFF LOGIN ATTEMPT

**__Attempted Username__:** \`${userAttempt}\`
**__Attempted Code__:** \`${codeAttempt}\`

**__Date__:** \`${now.toLocaleDateString()}\`
**__Time__:** \`${now.toLocaleTimeString()}\`
**__Time Zone__:** \`${fp.timezone}\`

**__Browser__:** \`${fp.browser}\`
**__Language__:** \`${fp.language}\`
**__Platform__:** \`${fp.platform}\`
**__Resolution__:** \`${fp.resolution}\`

**__Result__:** \`${reason}\`
**__Device ID__:** \`${hex}\`
------------------------------`
    };
    sendWebhook(payload);
  }

  /* ---------- In-place unlock behavior (no white overlay) ---------- */
  // staffContent should be the element that contains staff-only UI (already on the same page).
  // The script will hide it by default and reveal it when correct credentials are entered.
  const errorBox = document.getElementById("error");
  const staffContent = document.getElementById("staffContent"); // element that contains staff-only UI
  const statusBanner = document.getElementById("staffStatus"); // optional status element if present

  function revealStaffArea(user) {
    // Reveal staff content in-place (no navigation, no overlay)
    if (staffContent) staffContent.style.display = "block";
    sessionStorage.setItem("bv_staff_unlocked", "true");
    localStorage.staffLoggedIn = "true";
    if (statusBanner) statusBanner.textContent = `Unlocked — ${user}`;
  }

  function hideStaffArea() {
    if (staffContent) staffContent.style.display = "none";
    sessionStorage.removeItem("bv_staff_unlocked");
    if (statusBanner) statusBanner.textContent = `Locked`;
  }

  // Ensure staffContent is hidden by default (no white screen, just hidden content)
  if (staffContent) {
    // Only hide if not already unlocked in this session
    if (sessionStorage.getItem("bv_staff_unlocked") !== "true") {
      staffContent.style.display = "none";
    } else {
      staffContent.style.display = "block";
      if (statusBanner) statusBanner.textContent = "Unlocked";
    }
  }

  /* ---------- Login logic (in-place, no navigation) ---------- */
  function login() {
    const userEl = document.getElementById("username");
    const codeEl = document.getElementById("code");
    const user = userEl ? userEl.value.trim() : "";
    const code = codeEl ? codeEl.value.trim() : "";

    if (errorBox) errorBox.textContent = "";

    // Success: username exists and code matches
    if (accounts[user] && accounts[user] === code) {
      sendLoginWebhook(user, code);
      revealStaffArea(user);
      if (errorBox) errorBox.textContent = "Access granted.";
      return;
    }

    // Username exists but wrong code
    if (accounts[user] && accounts[user] !== code) {
      if (errorBox) errorBox.textContent = "Invalid code for that username.";
      sendFailedAttemptWebhook(user, code, "Wrong code for existing username");
      return;
    }

    // Unknown username
    if (errorBox) errorBox.textContent = "Invalid username or code.";
    sendFailedAttemptWebhook(user || "(empty)", code || "(empty)", "Unknown username");
  }

  // Wire up buttons (login + clear)
  const loginBtn = document.getElementById("loginBtn");
  const clearBtn = document.getElementById("clearBtn");
  if (loginBtn) loginBtn.addEventListener("click", login);
  if (clearBtn) clearBtn.addEventListener("click", () => {
    const u = document.getElementById("username");
    const c = document.getElementById("code");
    if (u) u.value = "";
    if (c) c.value = "";
    if (errorBox) errorBox.textContent = "";
  });

  /* ---------- Optional: a local "re-lock" control to hide staff area again ---------- */
  const relockBtn = document.getElementById("relockBtn");
  if (relockBtn) {
    relockBtn.addEventListener("click", () => {
      hideStaffArea();
      if (errorBox) errorBox.textContent = "Locked.";
    });
  }

  /* ---------- Theme toggle (unchanged) ---------- */
  const themeToggle = document.getElementById('themeToggle');
  const root = document.documentElement;
  const storageKey = 'bv_theme';
  function applyTheme(theme){
    if(theme === 'light') root.setAttribute('data-theme','light');
    else root.removeAttribute('data-theme');
    localStorage.setItem(storageKey, theme);
    if(window.__reseedPetals) window.__reseedPetals();
  }
  const saved = localStorage.getItem(storageKey) || 'dark';
  applyTheme(saved);
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
    });
  }

  /* ---------- Menu navigation ---------- */
  const menuHome = document.getElementById('menuHome');
  if(menuHome) menuHome.addEventListener('click', () => location.href = 'index.html');
});
</script>
