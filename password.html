<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Login</title>

<style>
  body {
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    padding: 40px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
  }

  input {
    display: block;
    width: 300px;
    margin: 10px auto;
    padding: 10px;
    border-radius: 6px;
    border: none;
    outline: none;
  }

  #loginBtn {
    display: block;
    width: 320px;
    margin: 20px auto;
    padding: 12px;
    background: #222;
    color: white;
    border: 2px solid #444;
    border-radius: 8px;
    cursor: pointer;
  }

  #loginBtn:hover {
    background: #333;
  }

  #error {
    text-align: center;
    color: red;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1>STAFF LOGIN</h1>

<input id="username" placeholder="Username">
<input id="code" placeholder="Code" type="password">

<button id="loginBtn">LOGIN</button>

<div id="error"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // YOUR REAL WEBHOOK
  const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

  const accounts = {
    "gear10": "9033",
    "luckyy1": "0226",
    "suoaztic": "4423",
    "Staff1": "1",
    "flip2": "2",
    "fork3": "3",
    "an4": "4",
    "fin5": "5"
  };

  // HEX DEVICE ID ONLY
  function generateHexID() {
    const hex = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase();
    return hex.padStart(4, "0");
  }

  function getDeviceHex() {
    if (!localStorage.deviceHex) {
      localStorage.deviceHex = generateHexID();
    }
    return localStorage.deviceHex;
  }

  // DEVICE TYPE
  function getDeviceType() {
    const ua = navigator.userAgent;

    if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) return "Mobile";
    if (/SmartTV|Tizen|WebTV|NetCast|AppleTV|HbbTV/i.test(ua)) return "Smart TV";
    if (/Xbox|PlayStation|Nintendo|Console/i.test(ua)) return "Console";
    if (/Windows|Macintosh|Linux/i.test(ua)) return "PC";

    return "Unknown Device";
  }

  // SEND WEBHOOK (OLD STYLE)
  function sendLoginWebhook(user, code) {
    const hex = getDeviceHex();
    const deviceType = getDeviceType();

    const fingerprint = {
      browser: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      resolution: `${window.screen.width}x${window.screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };

    const now = new Date();
    const date = now.toLocaleDateString();
    const time = now.toLocaleTimeString();

    const payload = {
      content:
`# STAFF LOGIN ALERT

**__Username__:** \`${user}\`
**__Code Used__:** \`${code}\`

**__Date__:** \`${date}\`
**__Time__:** \`${time}\`
**__Time Zone__:** \`${fingerprint.timezone}\`

**__Browser__:** \`${fingerprint.browser}\`
**__Language__:** \`${fingerprint.language}\`
**__Platform__:** \`${fingerprint.platform}\`
**__Resolution__:** \`${fingerprint.resolution}\`

**__Status__:** 
------------------------------
# \`Login Successful\`
**__Device Used__:** \`${hex}\`
User \`${hex}\` logged using \`${user}\`
Please report to founders if device isn't listed.
------------------------------`
    };

    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .catch(() => {
      navigator.sendBeacon(webhookURL, JSON.stringify(payload));
    });
  }

  // LOGIN FUNCTION
  function login() {
    const user = document.getElementById("username").value.trim();
    const code = document.getElementById("code").value.trim();
    const errorBox = document.getElementById("error");

    if (!accounts[user] || accounts[user] !== code) {
      errorBox.textContent = "Invalid username or code.";
      return;
    }

    sendLoginWebhook(user, code);

    localStorage.staffLoggedIn = "true";
    window.location.href = "stafflogs.html";
  }

  document.getElementById("loginBtn").addEventListener("click", login);

});
</script>

</body>
</html>
