<script>
document.addEventListener("DOMContentLoaded", () => {
  // Replace with your webhook URL
  const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

  const accounts = {
    "gear10": "9033",
    "luckyy1": "0226",
    "suoaztic": "4423",
    "Staff1": "1",
    "flip2": "2",
    "fork3": "3",
    "an4": "4",
    "fin5": "5"
  };

  function generateHexID() {
    const hex = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase();
    return hex.padStart(4, "0");
  }

  function getDeviceHex() {
    if (!localStorage.deviceHex) {
      localStorage.deviceHex = generateHexID();
    }
    return localStorage.deviceHex;
  }

  function buildFingerprint() {
    return {
      browser: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      resolution: `${window.screen.width}x${window.screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }

  function sendWebhook(payloadObj) {
    const body = JSON.stringify(payloadObj);
    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body
    }).catch(() => {
      if (navigator.sendBeacon) navigator.sendBeacon(webhookURL, body);
    });
  }

  function sendLoginWebhook(user, code) {
    const hex = getDeviceHex();
    const fp = buildFingerprint();
    const now = new Date();
    const payload = {
      content:
`# STAFF LOGIN ALERT

**__Username__:** \`${user}\`
**__Code Used__:** \`${code}\`

**__Date__:** \`${now.toLocaleDateString()}\`
**__Time__:** \`${now.toLocaleTimeString()}\`
**__Time Zone__:** \`${fp.timezone}\`

**__Browser__:** \`${fp.browser}\`
**__Language__:** \`${fp.language}\`
**__Platform__:** \`${fp.platform}\`
**__Resolution__:** \`${fp.resolution}\`

**__Status__:** 
------------------------------
\`Login Successful\`
**__Device Used__:** \`${hex}\`
User \`${hex}\` logged using \`${user}\`
------------------------------`
    };
    sendWebhook(payload);
  }

  function sendFailedAttemptWebhook(userAttempt, codeAttempt, reason = "Invalid credentials") {
    const hex = getDeviceHex();
    const fp = buildFingerprint();
    const now = new Date();
    const payload = {
      content:
`# STAFF LOGIN ATTEMPT

**__Attempted Username__:** \`${userAttempt}\`
**__Attempted Code__:** \`${codeAttempt}\`

**__Date__:** \`${now.toLocaleDateString()}\`
**__Time__:** \`${now.toLocaleTimeString()}\`
**__Time Zone__:** \`${fp.timezone}\`

**__Browser__:** \`${fp.browser}\`
**__Language__:** \`${fp.language}\`
**__Platform__:** \`${fp.platform}\`
**__Resolution__:** \`${fp.resolution}\`

**__Result__:** \`${reason}\`
**__Device ID__:** \`${hex}\`
------------------------------`
    };
    sendWebhook(payload);
  }

  function login() {
    const user = document.getElementById("username").value.trim();
    const code = document.getElementById("code").value.trim();
    const errorBox = document.getElementById("error");

    errorBox.textContent = "";

    // If username exists and code matches -> success
    if (accounts[user] && accounts[user] === code) {
      sendLoginWebhook(user, code);
      localStorage.staffLoggedIn = "true";
      window.open("stafflog.html", "_blank");
      return;
    }

    // If username exists but code wrong -> failed attempt
    if (accounts[user] && accounts[user] !== code) {
      errorBox.textContent = "Invalid code for that username.";
      sendFailedAttemptWebhook(user, code, "Wrong code for existing username");
      return;
    }

    // Username not found -> failed attempt
    errorBox.textContent = "Invalid username or code.";
    sendFailedAttemptWebhook(user || "(empty)", code || "(empty)", "Unknown username");
  }

  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("clearBtn").addEventListener("click", () => {
    document.getElementById("username").value = "";
    document.getElementById("code").value = "";
    document.getElementById("error").textContent = "";
  });

  // theme toggle (applies across pages)
  const themeToggle = document.getElementById('themeToggle');
  const root = document.documentElement;
  const storageKey = 'bv_theme';
  function applyTheme(theme){
    if(theme === 'light') root.setAttribute('data-theme','light');
    else root.removeAttribute('data-theme');
    localStorage.setItem(storageKey, theme);
    if(window.__reseedPetals) window.__reseedPetals();
  }
  const saved = localStorage.getItem(storageKey) || 'dark';
  applyTheme(saved);
  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
  });

  // menu navigation
  const menuHome = document.getElementById('menuHome');
  if(menuHome) menuHome.addEventListener('click', () => location.href = 'index.html');
});
</script>
