<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204"><title>Black Velvet | Clips</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Orbitron,Arial,sans-serif}main{position:relative;z-index:1;width:min(850px,90%);margin:auto;padding:45px 0 75px}.top{display:flex;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}a{color:var(--silver);font-size:11px;letter-spacing:1.5px;text-decoration:none}.eyebrow{margin:48px 0 12px;color:var(--silver);font-size:11px;letter-spacing:3px}h1,h2{font-family:Cinzel,Georgia,serif}h1{margin:0;font-size:clamp(42px,8vw,70px);letter-spacing:4px}.intro,.notice{color:#aab5bc;font:15px/1.7 Arial,sans-serif}.card{margin-top:24px;padding:22px;border:1px solid var(--line);border-radius:14px;background:rgba(7,11,15,.9)}input,textarea{width:100%;margin:8px 0 12px;padding:12px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:#080c10;font:14px Arial,sans-serif}.hint{display:block;margin:-4px 0 12px;color:#84929a;font:12px Arial,sans-serif}button{padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:var(--silver);color:#07090b;font:700 10px Orbitron,sans-serif;letter-spacing:1px;cursor:pointer}.clip{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:12px;background:rgba(7,11,15,.9)}.author{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;object-fit:cover;background:#111}.meta{color:#87949c;font:11px Arial,sans-serif}.clip-video{display:block;width:100%;aspect-ratio:16/9;max-height:500px;margin:15px 0 0;border:1px solid var(--line);border-radius:10px;background:#000;object-fit:contain}.play-button{display:block;width:100%;margin-top:10px}.clip-link{display:inline-block;margin:15px 0;color:var(--silver);font:12px Orbitron,sans-serif}.delete{float:right;background:transparent;color:#e6a6a6}.comments-toggle{margin-top:15px;background:transparent;color:var(--silver)}.comments-area{display:none;margin-top:12px}.comments-area.open{display:block}.comment{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:#c1cbd0;font:13px Arial,sans-serif}.comment-replies{margin-left:20px;padding-left:13px;border-left:1px solid var(--line)}.comment-actions{display:flex;gap:7px;margin-top:8px}.comment-action,.comment-delete{padding:5px 8px;border-radius:5px;background:transparent;font-size:9px}.comment-action{color:var(--silver)}.comment-delete{color:#e6a6a6}.comment-form{display:flex;gap:8px;margin-top:12px}.comment-form input{margin:0}.reply-form{margin:9px 0 0}.reply-form input{margin:0}.comment-status{margin:8px 0 0;color:#aab5bc;font:12px Arial,sans-serif}.empty{color:#84919a;font:14px Arial,sans-serif}
  </style>
</head>
<body>
  <main>
    <header class="top"><a href="home.html">← BLACK VELVET HOME</a><a href="Game.html">GAMES</a><a href="rankings.html">RANKINGS</a></header>
    <p class="eyebrow">BLACK VELVET // COMMUNITY MEDIA</p><h1>CLIPS</h1>
    <p class="intro">Approved members and staff can publish clips. Everyone can view and comment.</p>
    <section id="postArea"></section><section id="feed"></section>
  </main>
  <script src="theme.js"></script>
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

    const supabase=createClient("https://ptgzhljvzyceawwohmym.supabase.co","sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk");
    const profile=JSON.parse(localStorage.getItem("blackVelvetProfile")||"null"),staffRoles=["Owner","Admin","Manager","President","Mod","Helper"],isStaff=staffRoles.includes(profile?.role),postArea=document.getElementById("postArea"),feed=document.getElementById("feed"),openComments=new Set(),openReplies=new Set();
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&gt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

    function cleanName(name){return name.toLowerCase().replace(/[^a-z0-9._-]/g,"-")}
    function isVideoUrl(url){return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url)||url.includes("/storage/v1/object/public/black-velvet-media/")}

    function clipPlayer(url,id){
      if(!isVideoUrl(url))return `<a class="clip-link" href="${esc(url)}" target="_blank" rel="noopener">OPEN EXTERNAL CLIP ↗</a>`;
      return `<video id="video-${id}" class="clip-video" muted playsinline preload="auto"><source src="${esc(url)}">Your browser cannot preview this video.</video><button class="play-button" data-play-video="${id}">▶ PLAY CLIP</button>`;
    }

    async function uploadClip(file){
      if(file.size>100*1024*1024)throw new Error("Clip uploads must be 100 MB or smaller.");
      const path=`member-clips/${profile.username.toLowerCase()}-${crypto.randomUUID()}-${cleanName(file.name)}`;
      const {error}=await supabase.storage.from("black-velvet-media").upload(path,file,{upsert:false});
      if(error)throw error;
      return supabase.storage.from("black-velvet-media").getPublicUrl(path).data.publicUrl;
    }

    if(profile){
      postArea.innerHTML=`<form id="postForm" class="card"><h2>POST A CLIP</h2><textarea name="caption" maxlength="300" placeholder="Caption"></textarea><input name="file" type="file" accept="video/mp4,video/webm,video/quicktime"><input name="url" type="url" placeholder="Or paste a direct video URL"><span class="hint">Upload a video or provide a direct video URL. Maximum upload size: 100 MB.</span><button>POST CLIP</button><p id="postMessage" class="notice"></p></form>`;
    }else{
      postArea.innerHTML=`<div class="card notice">Log in as an approved member or staff member to post clips.</div>`;
    }

    document.getElementById("postForm")?.addEventListener("submit",async e=>{
      e.preventDefault();
      const d=new FormData(e.target),file=d.get("file"),url=d.get("url").trim(),message=document.getElementById("postMessage");
      if(!file?.name&&!url){message.textContent="Choose a clip file or enter a clip URL.";return}
      message.textContent="Uploading clip...";
      try{
        const clipUrl=file?.name?await uploadClip(file):url;
        const {error}=await supabase.from("clips").insert({author_username:profile.username,caption:d.get("caption").trim(),clip_url:clipUrl});
        if(error)throw error;
        e.target.reset();message.textContent="Clip posted live.";await load();
      }catch(error){message.textContent=`Could not post clip: ${error.message}`}
    });

    function renderComment(comment,allComments,clipId){
      const replies=allComments.filter(item=>item.parent_comment_id===comment.id);
      const canDelete=isStaff||profile?.username===comment.author_username;
      return `<div class="comment"><strong>${esc(comment.author_username)}</strong>: ${esc(comment.comment_text)}
        <div class="comment-actions">
          ${profile?`<button class="comment-action" data-toggle-reply="${comment.id}">REPLY</button>`:""}
          ${canDelete?`<button class="comment-delete" data-delete-comment="${comment.id}">DELETE</button>`:""}
        </div>
        ${profile&&openReplies.has(comment.id)?`<form class="comment-form reply-form" data-comment-form="${clipId}" data-parent-comment="${comment.id}"><input name="comment" maxlength="250" required placeholder="Reply to ${esc(comment.author_username)}"><button>REPLY</button></form>`:""}
        ${replies.length?`<div class="comment-replies">${replies.map(reply=>renderComment(reply,allComments,clipId)).join("")}</div>`:""}
      </div>`;
    }

    async function load(){
      const [{data:clips},{data:members},{data:comments}]=await Promise.all([
        supabase.from("clips").select("*").order("created_at",{ascending:false}),
        supabase.from("clan_members").select("username,avatar_url"),
        supabase.from("clip_comments").select("*").order("created_at")
      ]);
      const avatars=Object.fromEntries((members||[]).map(m=>[m.username,m.avatar_url]));
      feed.innerHTML=(clips||[]).length?(clips||[]).map(c=>{
        const clipComments=(comments||[]).filter(x=>x.clip_id===c.id),topLevel=clipComments.filter(x=>!x.parent_comment_id);
        return `<article class="clip"><div class="author"><img class="avatar" src="${esc(avatars[c.author_username]||"https://placehold.co/80x80/111827/dce5eb?text=BV")}" onerror="this.src='https://placehold.co/80x80/111827/dce5eb?text=BV'"><div><a href="profile.html?user=${encodeURIComponent(c.author_username)}">${esc(c.author_username)}</a><div class="meta">${new Date(c.created_at).toLocaleString()}</div></div></div>${(isStaff||profile?.username===c.author_username)?`<button class="delete" data-delete-clip="${c.id}">DELETE</button>`:""}<p>${esc(c.caption)}</p>${clipPlayer(c.clip_url,c.id)}<button class="comments-toggle" data-toggle-comments="${c.id}">COMMENTS (${clipComments.length}) ${openComments.has(c.id)?"▲":"▼"}</button><section id="comments-${c.id}" class="comments-area ${openComments.has(c.id)?"open":""}">${topLevel.map(x=>renderComment(x,clipComments,c.id)).join("")||`<p class="empty">No comments yet.</p>`}${profile?`<form class="comment-form" data-comment-form="${c.id}"><input name="comment" maxlength="250" required placeholder="Write a comment"><button>COMMENT</button></form><p class="comment-status" id="comment-status-${c.id}"></p>`:""}</section></article>`;
      }).join(""):`<p class="empty">No clips have been posted yet.</p>`;
    }

    feed.addEventListener("submit",async e=>{
      const form=e.target.closest("[data-comment-form]");
      if(!form)return;
      e.preventDefault();
      const clipId=Number(form.dataset.commentForm),parentId=form.dataset.parentComment?Number(form.dataset.parentComment):null,text=new FormData(form).get("comment").trim();
      if(!text)return;
      const {error}=await supabase.from("clip_comments").insert({clip_id:clipId,author_username:profile.username,comment_text:text,parent_comment_id:parentId});
      if(error){alert(`Could not post comment: ${error.message}`);return}
      openComments.add(clipId);
      if(parentId)openReplies.delete(parentId);
      await load();
    });

    feed.addEventListener("click",async e=>{
      const play=e.target.closest("[data-play-video]"),toggle=e.target.closest("[data-toggle-comments]"),reply=e.target.closest("[data-toggle-reply]"),clip=e.target.closest("[data-delete-clip]"),comment=e.target.closest("[data-delete-comment]");
      if(play){
        const video=document.getElementById(`video-${play.dataset.playVideo}`);
        video.muted=false;video.controls=true;await video.play();play.remove();
      }
      if(toggle){
        const id=Number(toggle.dataset.toggleComments);
        openComments.has(id)?openComments.delete(id):openComments.add(id);
        await load();
      }
      if(reply){
        const id=Number(reply.dataset.toggleReply);
        openReplies.has(id)?openReplies.delete(id):openReplies.add(id);
        await load();
      }
      if(clip){await supabase.from("clips").delete().eq("id",clip.dataset.deleteClip);await load()}
      if(comment){await supabase.from("clip_comments").delete().eq("id",comment.dataset.deleteComment);await load()}
    });

    await load();
    ["clips","clip_comments","clan_members"].forEach(table=>supabase.channel(`clip-${table}`).on("postgres_changes",{event:"*",schema:"public",table},load).subscribe());
  </script>
</body>
</html>
