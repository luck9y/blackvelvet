<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Applications — Black Velvet</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
        line-height: 1.6;
    }

    h1 {
        text-align: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 28px;
        margin-bottom: 30px;
        text-shadow: 0 0 10px #fff;
    }

    .log-box {
        max-width: 900px;
        margin: auto;
        background: #1a1a1a;
        padding: 30px;
        border-radius: 10px;
        border-left: 6px solid #ffffff;
        box-shadow: 0 0 15px #ffffff33;
    }

    .entry {
        background: #111;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px #ffffff22;
    }

    .entry h2 {
        font-family: 'Press Start 2P', cursive;
        font-size: 16px;
        margin-bottom: 10px;
        color: #fff;
        text-shadow: 0 0 6px #fff;
    }

    .entry p {
        font-size: 14px;
        color: #ccc;
        margin-bottom: 8px;
    }

    .soon {
        text-align: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 18px;
        margin-top: 20px;
        color: #fff;
        text-shadow: 0 0 10px #fff;
    }
</style>
</head>

<body>

<h1>STAFF APPLICATION LOGS</h1>

<div class="log-box">

    <div class="soon">APPLICATION STORAGE — SOON ADDED</div>

    <!-- Example entry (you can manually add these for now) -->
    <!--
    <div class="entry">
        <h2>Discord: username#0000</h2>
        <p><strong>Why they want staff:</strong> Example answer...</p>
        <p><strong>What makes them different:</strong> Example answer...</p>
        <p><strong>Anything else:</strong> Example answer...</p>
    </div>
    -->

</div>

</body>
</html>
