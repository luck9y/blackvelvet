# 🖤 **HOW IT WORKS**
We will use a simple flag:

### `localStorage.staffLoggedIn = "true"`

This flag is set **only** when the user logs in through password.html.

So in stafflog.html:

### ✔ If flag exists → show the page

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Log</title>

<style>
  body {
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    padding: 40px;
    text-align: center;
  }

  .btn {
    display: block;
    width: 300px;
    margin: 15px auto;
    padding: 15px;
    background: #111;
    border: 2px solid #444;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    cursor: pointer;
  }

  .btn:hover {
    background: #222;
  }

  #blocked {
    display: none;
    margin-top: 50px;
  }

  #blocked button {
    padding: 12px 20px;
    background: #222;
    border: 2px solid #444;
    border-radius: 8px;
    color: white;
    cursor: pointer;
  }

  }

  #content {
    display: none;
  }
</style>
</head>

<h1>STAFF LOG</h1>

<!-- BLOCKED VIEW -->
<div id="blocked">
  <p>You must log in first.</p>
  <button onclick="window.location.href='index.html'">Return to Home</button>
</div>

<!-- REAL CONTENT -->
<div id="content">
  <button class="btn">test</button>
  <button class="btn">test</button>
  <button class="btn">test</button>
  <button class="btn">test</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Check login status
  const loggedIn = localStorage.staffLoggedIn === "true";

  if (loggedIn) {
    // Show staff content
    document.getElementById("content").style.display = "block";
  } else {
    // Show blocked message
