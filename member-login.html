<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204">
  <title>Black Velvet | Member Login</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Orbitron,Arial,sans-serif}main{position:relative;z-index:1;width:min(560px,90%);margin:auto;padding:45px 0 75px}.top{display:flex;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}a{color:var(--silver);font-size:11px;letter-spacing:1.5px;text-decoration:none}.eyebrow{margin:58px 0 15px;color:var(--silver);font-size:11px;letter-spacing:3px}h1{margin:0;font-family:Cinzel,Georgia,serif;font-size:clamp(42px,8vw,75px);letter-spacing:4px}.intro{color:#aab5bc;font:16px/1.8 Arial,sans-serif}form{margin-top:28px;padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(7,11,15,.88)}label{display:block;margin:18px 0 8px;color:var(--silver);font-size:12px;font-weight:700;letter-spacing:1px}input{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:7px;outline:none;color:var(--text);background:#080c10;font:14px Arial,sans-serif}button{width:100%;margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:7px;color:#06080a;background:var(--silver);font:700 12px Orbitron,sans-serif;letter-spacing:2px;cursor:pointer}#message{min-height:22px;margin:16px 0 0;color:var(--silver);font:13px Arial,sans-serif;text-align:center}#message.error{color:#e7a4a4}
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a href="home.html">← BLACK VELVET HOME</a>
      <a href="clan-signup.html">SIGN UP</a>
    </header>

    <p class="eyebrow">BLACK VELVET // MEMBER ACCESS</p>
    <h1>LOGIN</h1>
    <p class="intro">Enter your approved Black Velvet member account.</p>

    <form id="loginForm">
      <label>USERNAME<input id="username" maxlength="40" autocomplete="username" required></label>
      <label>PASSWORD<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">ENTER NETWORK</button>
      <p id="message" role="alert"></p>
    </form>
  </main>

  <script src="theme.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase=createClient(
      "https://ptgzhljvzyceawwohmym.supabase.co",
      "sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk"
    );

    const form=document.getElementById("loginForm");
    const message=document.getElementById("message");

    async function hashPassword(password){
      const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(password));
      return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("");
    }

    function deviceInfo(){
      let hex=localStorage.getItem("blackVelvetDeviceHex");

      if(!hex){
        const bytes=new Uint8Array(2);
        crypto.getRandomValues(bytes);
        hex=`D${Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase()}`;
        localStorage.setItem("blackVelvetDeviceHex",hex);
      }

      return {
        device_hex:hex,
        device:/Mobi|Android/i.test(navigator.userAgent)?"Mobile device":"Desktop device",
        browser:navigator.userAgent,
        language:navigator.language||"Unknown",
        platform:navigator.platform||"Unknown",
        resolution:`${screen.width}x${screen.height}`
      };
    }

    async function getBan(username){
      const info=deviceInfo();
      const {data,error}=await supabase.from("account_bans").select("*");

      if(error) throw error;

      return (data||[]).find(ban=>
        ban.username?.toLowerCase()===username.toLowerCase() ||
        (ban.device_hexes||[]).includes(info.device_hex)
      );
    }

    async function log(username,success,reason){
      await supabase.from("member_access_logs").insert({
        username,
        success,
        reason,
        ...deviceInfo()
      });
    }

    form.addEventListener("submit",async event=>{
      event.preventDefault();

      const username=document.getElementById("username").value.trim();
      const password=document.getElementById("password").value;
      message.className="";
      message.textContent="VERIFYING ACCESS...";

      try{
        const ban=await getBan(username);

        if(ban){
          localStorage.removeItem("blackVelvetProfile");
          localStorage.setItem("blackVelvetBanned","true");
          await log(username||"Blank username",false,"Account or device is permanently banned");
          message.className="error";
          message.textContent="THIS ACCOUNT OR DEVICE IS BANNED.";
          return;
        }

        localStorage.removeItem("blackVelvetBanned");

        const {data:application,error}=await supabase
          .from("clan_member_applications")
          .select("*")
          .ilike("username",username)
          .eq("status","Approved")
          .maybeSingle();

        const valid=!error&&application&&application.password_hash===await hashPassword(password);

        if(!valid){
          await log(username||"Blank username",false,"Invalid member username or password");
          message.className="error";
          message.textContent="INVALID MEMBER USERNAME OR PASSWORD.";
          return;
        }

        let {data:member,error:memberError}=await supabase
          .from("clan_members")
          .select("*")
          .ilike("username",application.username)
          .maybeSingle();

        if(memberError){
          message.className="error";
          message.textContent=`MEMBER PROFILE ERROR: ${memberError.message}`;
          return;
        }

        if(!member){
          const {data:created,error:createError}=await supabase.from("clan_members").insert({
            username:application.username,
            discord_tag:application.discord_tag,
            avatar_url:application.avatar_url||null,
            game:application.game||"Minecraft Java",
            rank:application.rank||"BVR",
            staff_rank:"N/A",
            is_staff:false,
            last_seen:new Date().toISOString()
          }).select().single();

          if(createError){
            message.className="error";
            message.textContent=`PROFILE SETUP FAILED: ${createError.message}`;
            return;
          }

          member=created;
        }else{
          await supabase
            .from("clan_members")
            .update({last_seen:new Date().toISOString()})
            .eq("id",member.id);
        }

        await log(member.username,true,"Approved member login");

        localStorage.setItem("blackVelvetProfile",JSON.stringify({
          username:member.username,
          role:member.rank,
          game:member.game,
          avatarUrl:member.avatar_url||"",
          rankingNumber:member.ranking_number,
          isStaff:Boolean(member.is_staff),
          staffRank:member.staff_rank||"N/A"
        }));

        window.location.href="home.html";
      }catch(error){
        message.className="error";
        message.textContent=`LOGIN CHECK FAILED: ${error.message}`;
      }
    });
  </script>
</body>
</html>
