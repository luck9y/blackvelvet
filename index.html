<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet — Home</title>

<style>
  :root{
    --bg:#050506;
    --text:#e9e6ef;
    --muted:#9a8fb8;
    --accent:#ffffff;
    font-family:Inter,system-ui;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    cursor:none; /* hide default cursor */
  }

  /* Custom cursor aura */
  #cursorAura{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(40,40,40,0.6), rgba(0,0,0,0.9));
    pointer-events:none;
    z-index:9999;
    filter:blur(6px);
    transition:transform 0.05s linear;
  }

  /* Black Velvet Flower */
  .velvet-flower{
    position:absolute;
    width:320px;
    height:320px;
    pointer-events:auto;
    z-index:0;
    opacity:0.35;
    transition:opacity 0.25s ease-out, transform 0.25s ease-out;
  }

  .petal-shape{
    position:absolute;
    width:140px;
    height:210px;
    background:linear-gradient(135deg,#0a0a0a,#1c1c1c);
    border-radius:50% 50% 40% 60%;
    filter:drop-shadow(0 0 22px rgba(0,0,0,0.8));
  }

  .petal1{ transform:rotate(0deg) translateY(-110px); }
  .petal2{ transform:rotate(72deg) translateY(-110px); }
  .petal3{ transform:rotate(144deg) translateY(-110px); }
  .petal4{ transform:rotate(216deg) translateY(-110px); }
  .petal5{ transform:rotate(288deg) translateY(-110px); }

  .flower-center{
    position:absolute;
    width:110px;
    height:110px;
    background:#0d0d0d;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 32px rgba(255,255,255,0.15);
  }

  /* Water droplets */
  .droplet{
    position:absolute;
    width:6px;
    height:6px;
    background:rgba(180,180,180,0.25);
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    animation:dropFall 4s linear forwards;
  }

  @keyframes dropFall{
    0%{ transform:translateY(-20px) scale(1); opacity:0.8; }
    100%{ transform:translateY(120vh) scale(0.4); opacity:0; }
  }

  /* Page content */
  .page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    position:relative;
    z-index:2;
    transform:translateX(-30px);
  }

  h1{
    font-size:42px;
    margin:0;
    color:var(--accent);
    text-shadow:0 0 12px rgba(255,255,255,0.8);
  }

  p{
    margin-top:10px;
    font-size:16px;
    color:var(--muted);
  }

  /* Glow buttons */
  .btn{
    padding:12px 20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    box-shadow:
      0 0 12px rgba(255,255,255,0.6),
      0 0 22px rgba(255,255,255,0.4),
      inset 0 0 12px rgba(255,255,255,0.3);
    transition:0.25s;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 0 18px rgba(255,255,255,0.9),
      0 0 32px rgba(255,255,255,0.7),
      inset 0 0 18px rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<!-- Cursor Aura -->
<div id="cursorAura"></div>

<!-- Black Velvet Flower -->
<div id="velvetFlower" class="velvet-flower">
  <div class="petal-shape petal1"></div>
  <div class="petal-shape petal2"></div>
  <div class="petal-shape petal3"></div>
  <div class="petal-shape petal4"></div>
  <div class="petal-shape petal5"></div>
  <div class="flower-center"></div>
</div>

<div id="dropletLayer"></div>

<div class="page">
  <h1>Black Velvet</h1>
  <p>Welcome to the official clan hub.</p>

  <div style="display:flex; flex-direction:column; gap:14px; margin-top:24px; width:240px;">
    <a href="ranks.html" class="btn">Clan Ranks</a>
    <a href="rules.html" class="btn">Rules</a>
    <a href="information.html" class="btn">Information</a>
    <a href="staffapply.html" class="btn">Apply for Staff</a>
    <a href="staffpanel.html" class="btn">Staff Login</a>
  </div>
</div>

<script>
/* Cursor Aura */
const aura = document.getElementById("cursorAura");
document.addEventListener("mousemove", e=>{
  aura.style.left = (e.clientX - 30) + "px";
  aura.style.top = (e.clientY - 30) + "px";
});

/* Water droplets */
(function(){
  const layer = document.getElementById('dropletLayer');
  function rand(min,max){ return Math.random()*(max-min)+min; }

  function spawnDroplet(){
    const d = document.createElement('div');
    d.className = 'droplet';
    d.style.left = rand(0, window.innerWidth) + 'px';
    d.style.top = rand(-40, -10) + 'px';
    layer.appendChild(d);
    setTimeout(()=> d.remove(), 4000);
  }

  setInterval(spawnDroplet, 120);
})();

/* Touch-to-Dust Flower */
(function(){
  const flower = document.getElementById("velvetFlower");
  const clickSound = new Audio("sounds/click.mp3");

  function spawnFlower(){
    const maxX = window.innerWidth - 320;
    const maxY = window.innerHeight - 320;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    flower.style.left = x + "px";
    flower.style.top = y + "px";
  }

  // Initial spawn
  spawnFlower();

  // When cursor touches the flower
  flower.addEventListener("mouseenter", ()=>{
    clickSound.currentTime = 0;
    clickSound.play();

    flower.style.opacity = "0";
    flower.style.transform = "scale(0.4)";

    setTimeout(()=>{
      spawnFlower();
      flower.style.opacity = "0.35";
      flower.style.transform = "scale(1)";
    }, 250);
  });

  window.addEventListener("resize", spawnFlower);
})();
</script>

</body>
</html>
