<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet — Home</title>

<style>
  :root{
    --bg:#050506;
    --text:#e9e6ef;
    --muted:#9a8fb8;
    --accent:#ffffff;
    font-family:Inter,system-ui;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }

  /* Floating Black Velvet Flower */
  .velvet-flower{
    position:absolute;
    width:320px;
    height:320px;
    pointer-events:auto;
    z-index:0;
    opacity:0.35;
    transition:
      left 1.2s ease-out,
      top 1.2s ease-out,
      transform 0.4s ease-out;
  }

  .petal-shape{
    position:absolute;
    width:140px;
    height:210px;
    background:linear-gradient(135deg,#0a0a0a,#1c1c1c);
    border-radius:50% 50% 40% 60%;
    filter:drop-shadow(0 0 22px rgba(0,0,0,0.8));
  }

  .petal1{ transform:rotate(0deg) translateY(-110px); }
  .petal2{ transform:rotate(72deg) translateY(-110px); }
  .petal3{ transform:rotate(144deg) translateY(-110px); }
  .petal4{ transform:rotate(216deg) translateY(-110px); }
  .petal5{ transform:rotate(288deg) translateY(-110px); }

  .flower-center{
    position:absolute;
    width:110px;
    height:110px;
    background:#0d0d0d;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 32px rgba(255,255,255,0.15);
  }

  /* Water droplets */
  .droplet{
    position:absolute;
    width:6px;
    height:6px;
    background:rgba(180,180,180,0.25);
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    animation:dropFall 4s linear forwards;
  }

  @keyframes dropFall{
    0%{ transform:translateY(-20px) scale(1); opacity:0.8; }
    100%{ transform:translateY(120vh) scale(0.4); opacity:0; }
  }

  /* Page content */
  .page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    position:relative;
    z-index:2;
    transform:translateX(-30px);
  }

  h1{
    font-size:42px;
    margin:0;
    color:var(--accent);
    text-shadow:0 0 12px rgba(255,255,255,0.8);
  }

  p{
    margin-top:10px;
    font-size:16px;
    color:var(--muted);
  }

  /* Glow buttons */
  .btn{
    padding:12px 20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    box-shadow:
      0 0 12px rgba(255,255,255,0.6),
      0 0 22px rgba(255,255,255,0.4),
      inset 0 0 12px rgba(255,255,255,0.3);
    transition:0.25s;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 0 18px rgba(255,255,255,0.9),
      0 0 32px rgba(255,255,255,0.7),
      inset 0 0 18px rgba(255,255,255,0.5);
  }

  /* Ambient petals */
  .petal{
    position:absolute;
    width:34px;
    height:52px;
    border-radius:50% 50% 40% 60%;
    background:linear-gradient(135deg,rgba(18,18,18,0.98),rgba(36,36,36,0.9));
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.7));
    pointer-events:none;
    opacity:0.95;
    animation:floatUp 3.8s forwards cubic-bezier(.2,.8,.2,1);
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    60%{ transform:translateY(-120px) rotate(40deg); opacity:0.9; }
    100%{ transform:translateY(-300px) rotate(120deg); opacity:0; }
  }

  /* Cursor petals */
