<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Test</title>
</head>

<body style="background:black; color:white; padding:40px;">

<h1>Black Velvet — Audio Test</h1>

<button id="testAudioBtn" style="padding:20px; font-size:20px;">
  TEST AUDIO
</button>

<!-- AUDIO FILES -->
<audio id="clickSound" src="sounds/click.mp3" preload="auto"></audio>
<audio id="correctSound" src="sounds/correct.mp3" preload="auto"></audio>
<audio id="incorrectSound" src="sounds/wrong.mp3" preload="auto"></audio>

<script>
document.getElementById("testAudioBtn").addEventListener("click", () => {
    const sound = document.getElementById("clickSound");
    sound.currentTime = 0;
    sound.play().catch(err => {
        console.log("Audio error:", err);
    });
});
</script>

</body>
</html>
