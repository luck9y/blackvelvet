<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Black Velvet — Home</title>
  <style>
    :root{
      --bg:#0b0b0d;
      --panel:#0f0f11;
      --accent:#bfa6ff;
      --muted:#9a8fb8;
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --btn-bg: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
      --btn-border: rgba(255,255,255,0.06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(191,166,255,0.06), transparent 8%),
        radial-gradient(900px 500px at 90% 90%, rgba(255,120,150,0.03), transparent 6%),
        var(--bg);
      color:#e9e6ef;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Layout */
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
      box-sizing:border-box;
    }

    .card{
      width:980px;
      max-width:96%;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.18));
      border-radius:18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      display:grid;
      grid-template-columns: 320px 1fr;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
    }

    /* Left panel */
    .left{
      background:
        linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.12)),
        url('') center/cover no-repeat;
      padding:28px;
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:center;
      justify-content:flex-start;
      position:relative;
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:12px;
      background:linear-gradient(135deg, rgba(191,166,255,0.12), rgba(255,120,150,0.06));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      color:var(--accent);
      font-size:20px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .title{
      text-align:center;
      font-size:18px;
      color:#efeaf8;
      margin-top:6px;
    }

    .subtitle{
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    /* Center content */
    .main{
      padding:34px 36px;
      display:flex;
      flex-direction:column;
      gap:18px;
      position:relative;
    }

    .button-group{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
    }

    .btn{
      -webkit-appearance:none;
      appearance:none;
      border:1px solid var(--btn-border);
      background:var(--btn-bg);
      color:#efeaf8;
      padding:12px 16px;
      border-radius:10px;
      font-size:14px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px) saturate(120%);
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .btn:active{ transform:translateY(1px) scale(.998); }

    .btn:hover{
      transform:translateY(-4px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    /* Staff Login special styling */
    .btn.staff{
      border:1px solid rgba(191,166,255,0.18);
      background: linear-gradient(180deg, rgba(191,166,255,0.06), rgba(191,166,255,0.02));
      color:#fff;
      position:relative;
      overflow:visible;
    }

    /* subtle pulse on hover to match petals */
    .btn.staff::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:12px;
      background: radial-gradient(circle at 30% 20%, rgba(191,166,255,0.06), transparent 20%),
                  radial-gradient(circle at 70% 80%, rgba(255,120,150,0.03), transparent 18%);
      opacity:0;
      transition:opacity .28s ease, transform .28s ease;
      transform:scale(.96);
      pointer-events:none;
    }

    .btn.staff:hover::after{
      opacity:1;
      transform:scale(1.02);
    }

    /* small icon */
    .icon{
      width:18px;
      height:18px;
      display:inline-block;
      border-radius:4px;
      background:linear-gradient(180deg, var(--accent), #ff78a0);
      box-shadow: 0 4px 10px rgba(191,166,255,0.18);
    }

    /* Info / rules box */
    .panel{
      margin-top:8px;
      background:var(--glass);
      border-radius:12px;
      padding:14px;
      color:var(--muted);
      font-size:13px;
      border:1px solid rgba(255,255,255,0.02);
    }

    /* Footer */
    .footer{
      margin-top:auto;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      padding-bottom:6px;
    }

    /* Responsive */
    @media (max-width:880px){
      .card{ grid-template-columns: 1fr; }
      .left{ flex-direction:row; gap:12px; padding:18px; align-items:center; justify-content:flex-start; }
      .logo{ width:84px; height:84px; font-size:16px; }
      .main{ padding:20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-label="Black Velvet Home">
      <aside class="left" aria-hidden="false">
        <div class="logo" aria-hidden="true">BV</div>
        <div style="text-align:center;">
          <div class="title">Black Velvet</div>
          <div class="subtitle">A refined community experience</div>
        </div>
      </aside>

      <section class="main" aria-label="Main navigation">
        <h2 style="margin:0;font-size:16px;color:#efeaf8;">Welcome</h2>

        <div class="button-group" role="navigation" aria-label="Primary actions">
          <button class="btn" onclick="navigate('rules.html')" aria-label="Read Rules">
            <span class="icon" style="background:linear-gradient(180deg,#9f8bff,#cdb8ff);"></span>
            Read Rules
          </button>

          <button class="btn" onclick="navigate('ranks.html')" aria-label="View Ranks">
            <span class="icon" style="background:linear-gradient(180deg,#7fd3ff,#a6e7ff);"></span>
            View Ranks
          </button>

          <button class="btn" onclick="navigate('staffapply.html')" aria-label="Apply to Staff">
            <span class="icon" style="background:linear-gradient(180deg,#ffd38a,#ffb86b);"></span>
            Apply to Staff
          </button>

          <button class="btn" onclick="navigate('staffpolicies.html')" aria-label="Staff Policies">
            <span class="icon" style="background:linear-gradient(180deg,#c7f7c7,#9fe6a6);"></span>
            Staff Policies
          </button>

          <!-- Staff Login button added inline with the other nav buttons -->
          <button class="btn staff" id="staffLoginBtn" onclick="navigate('stafflogin.html')" aria-label="Staff Login">
            <span class="icon" style="background:linear-gradient(180deg,#bfa6ff,#ff78a0);"></span>
            Staff Login
          </button>
        </div>

        <div class="panel" role="region" aria-label="Quick info">
          <strong style="color:#efeaf8;">Quick tips</strong>
          <div style="margin-top:6px;">
            Keep your credentials secure. Staff login is restricted to approved members.
          </div>
        </div>

        <div class="footer" aria-hidden="false">
          <div>© <span id="year"></span> Black Velvet</div>
          <div style="opacity:.6;">•</div>
          <div style="opacity:.7;">Privacy</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // Basic navigation helper — keeps links consistent and easy to update.
    function navigate(path){
      // If you prefer opening in a new tab for staff login, change to window.open(path, '_blank')
      window.location.href = path;
    }

    // Accessibility: allow Enter key to activate focused buttons
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('btn')){
        document.activeElement.click();
      }
    });

    // Small runtime polish
    document.getElementById('year').textContent = new Date().getFullYear();

    // Optional: subtle focus ring for keyboard users
    document.addEventListener('focusin', (e) => {
      if(e.target.classList && e.target.classList.contains('btn')){
        e.target.style.outline = '2px solid rgba(191,166,255,0.18)';
        e.target.style.outlineOffset = '3px';
      }
    });
    document.addEventListener('focusout', (e) => {
      if(e.target.classList && e.target.classList.contains('btn')){
        e.target.style.outline = 'none';
      }
    });

    // If you want to gate the staff login button client-side (visual only),
    // uncomment and adapt the snippet below. Server-side auth is required for real protection.
    /*
    const isStaff = false; // replace with real check
    if(!isStaff){
      const btn = document.getElementById('staffLoginBtn');
      btn.setAttribute('title', 'Staff login restricted');
      // Optionally hide:
      // btn.style.display = 'none';
    }
    */
  </script>
</body>
</html>
