<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet — Home</title>
<style>
  :root{
    --bg:#050506;
    --text:#e9e6ef;
    --muted:#9a8fb8;
    --accent:#ffffff;
    font-family:Inter,system-ui,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    cursor:none; /* hide native cursor so custom flower cursor is visible */
  }

  /* Page layout */
  .page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    position:relative;
    z-index:20;
    transform:translateX(-30px);
    pointer-events:auto;
  }

  h1{ font-size:42px; margin:0; color:var(--accent); text-shadow:0 0 12px rgba(255,255,255,0.08); }
  p{ margin-top:10px; font-size:16px; color:var(--muted); }

  .btn{
    padding:12px 20px;
    border-radius:12px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.6);
    transition:transform .18s ease, box-shadow .18s ease;
    display:inline-block;
  }
  .btn:hover{ transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.7); }

  /* Falling petal (leaf-like) base */
  .falling-petal{
    position:absolute;
    width:36px;
    height:54px;
    border-radius:50% 50% 40% 60%;
    background:linear-gradient(135deg, rgba(34,34,34,0.98), rgba(64,64,64,0.88));
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.6));
    pointer-events:none;
    opacity:0.95;
    will-change: transform, opacity;
  }

  @keyframes leafFall {
    0%{
      transform: translate3d(var(--start-x,0), -80px, 0) rotate(var(--start-rot,0deg)) scale(var(--start-scale,1));
      opacity:1;
    }
    20%{
      transform: translate3d(calc(var(--start-x,0) + var(--sway,20px)), 10vh, 0) rotate(calc(var(--start-rot,0deg) + 15deg)) scale(calc(var(--start-scale,1) * 0.98));
    }
    50%{
      transform: translate3d(calc(var(--start-x,0) - var(--sway,12px)), 45vh, 0) rotate(calc(var(--start-rot,0deg) - 10deg)) scale(calc(var(--start-scale,1) * 1.02));
    }
    80%{
      transform: translate3d(calc(var(--start-x,0) + var(--sway,8px)), 80vh, 0) rotate(calc(var(--start-rot,0deg) + 25deg)) scale(calc(var(--start-scale,1) * 0.96));
      opacity:0.9;
    }
    100%{
      transform: translate3d(calc(var(--start-x,0) + var(--sway,0px)), 110vh, 0) rotate(calc(var(--start-rot,0deg) + 40deg)) scale(calc(var(--start-scale,1) * 0.94));
      opacity:0;
    }
  }

  /* Cursor Velvet Flower (small) */
  #cursorFlower{
    position:fixed;
    width:72px;
    height:72px;
    pointer-events:none;
    z-index:99999;
    transform:translate(-50%,-50%) scale(1);
    transition: transform 0.06s linear;
    will-change: transform, left, top;
    mix-blend-mode:normal;
  }

  /* small petal shapes inside cursor flower */
  .cursor-petal{
    position:absolute;
    width:34px;
    height:52px;
    background:linear-gradient(135deg,#0a0a0a,#1c1c1c);
    border-radius:50% 50% 40% 60%;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.6));
  }
  .c1{ transform:rotate(0deg) translateY(-28px) scale(0.45); left:50%; top:50%; transform-origin:center; }
  .c2{ transform:rotate(72deg) translateY(-28px) scale(0.45); left:50%; top:50%; transform-origin:center; }
  .c3{ transform:rotate(144deg) translateY(-28px) scale(0.45); left:50%; top:50%; transform-origin:center; }
  .c4{ transform:rotate(216deg) translateY(-28px) scale(0.45); left:50%; top:50%; transform-origin:center; }
  .c5{ transform:rotate(288deg) translateY(-28px) scale(0.45); left:50%; top:50%; transform-origin:center; }

  .cursor-center{
    position:absolute;
    width:36px;
    height:36px;
    background:#0d0d0d;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0.6);
    box-shadow:0 0 18px rgba(255,255,255,0.04);
  }

  /* Cursor water trail blob */
  .cursor-water{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(170,180,200,0.85), rgba(80,80,100,0.12));
    pointer-events:none;
    filter:blur(4px);
    opacity:0.95;
    transform:scale(0.8);
    will-change: transform, opacity;
    z-index:99998;
  }

  /* Water ripple on click */
  .ripple-ring{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    box-shadow: 0 0 18px rgba(160,170,190,0.12), inset 0 0 8px rgba(255,255,255,0.02);
    border:1px solid rgba(180,190,210,0.06);
    background: radial-gradient(circle, rgba(200,210,230,0.06), rgba(80,80,100,0));
    opacity:0.9;
    transform:scale(0.2);
    will-change: transform, opacity;
    z-index:99997;
  }

  /* small water droplet particle */
  .water-drop{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:linear-gradient(180deg, rgba(220,230,250,0.95), rgba(120,130,160,0.6));
    pointer-events:none;
    filter:blur(0.6px) drop-shadow(0 6px 12px rgba(0,0,0,0.45));
    opacity:0.95;
    z-index:99999;
    will-change: transform, opacity;
  }

  /* small responsiveness tweak so cursor doesn't get too big on tiny screens */
  @media (max-width:420px){
    #cursorFlower{ width:56px; height:56px; }
    .cursor-petal{ width:28px; height:42px; }
    .cursor-center{ width:28px; height:28px; transform:translate(-50%,-50%) scale(0.6); }
  }
</style>
</head>
<body>

<!-- Custom cursor: Velvet flower -->
<div id="cursorFlower" aria-hidden="true">
  <div class="cursor-petal c1"></div>
  <div class="cursor-petal c2"></div>
  <div class="cursor-petal c3"></div>
  <div class="cursor-petal c4"></div>
  <div class="cursor-petal c5"></div>
  <div class="cursor-center"></div>
</div>

<!-- Page content -->
<div class="page" id="pageContent">
  <h1>Black Velvet</h1>
  <p>Welcome to the official clan hub.</p>

  <div style="display:flex; flex-direction:column; gap:14px; margin-top:24px; width:240px;">
    <a href="ranks.html" class="btn">Clan Ranks</a>
    <a href="rules.html" class="btn">Rules</a>
    <a href="information.html" class="btn">Information</a>
    <a href="staffapply.html" class="btn">Apply for Staff</a>
    <a href="staffpanel.html" class="btn">Staff Login</a>
  </div>
</div>

<script>
/* ---------------------------
   Utilities
----------------------------*/
function rand(min, max){ return Math.random() * (max - min) + min; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------------------------
   Cursor Velvet Flower behavior
   - follows pointer smoothly
   - scales slightly on movement for liveliness
----------------------------*/
(function(){
  const cursor = document.getElementById('cursorFlower');
  let lastX = window.innerWidth / 2;
  let lastY = window.innerHeight / 2;
  let vx = 0, vy = 0;

  // smoothing factor
  const ease = 0.18;

  document.addEventListener('mousemove', e=>{
    // target position
    const tx = e.clientX;
    const ty = e.clientY;

    // immediate set for responsiveness, then smooth via RAF loop
    lastX = tx;
    lastY = ty;

    // small scale effect based on speed
    const speed = Math.hypot((tx - (cursor._prevX||tx)), (ty - (cursor._prevY||ty)));
    const scale = clamp(1 + Math.min(speed / 180, 0.28), 1, 1.28);
    cursor.style.transform = `translate(-50%,-50%) scale(${scale})`;

    cursor._prevX = tx;
    cursor._prevY = ty;
  });

  // RAF loop to smoothly move the cursor element
  let px = window.innerWidth / 2;
  let py = window.innerHeight / 2;
  function tick(){
    // ease px,py toward lastX,lastY
    px += (lastX - px) * ease;
    py += (lastY - py) * ease;
    cursor.style.left = px + 'px';
    cursor.style.top = py + 'px';

    // gently return scale to 1 over time
    const current = cursor.style.transform.match(/scale\(([^)]+)\)/);
    if(current){
      const s = parseFloat(current[1]);
      const ns = 1 + (s - 1) * 0.86;
      cursor.style.transform = `translate(-50%,-50%) scale(${ns})`;
    }

    requestAnimationFrame(tick);
  }
  tick();

  // show cursor on enter, hide on leave
  document.addEventListener('mouseenter', ()=> cursor.style.opacity = '1');
  document.addEventListener('mouseleave', ()=> cursor.style.opacity = '0');
})();

/* ---------------------------
   Leaf-like falling petals
----------------------------*/
(function(){
  const spawnInterval = 220; // ms between spawns
  const life = 6000; // remove after ~6s

  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'falling-petal';

    // random horizontal start offset so they don't all align
    const startX = rand(-40, 40) + 'px';
    const sway = rand(20, 120) + 'px'; // how much it sways horizontally
    const startRot = rand(-30, 30) + 'deg';
    const startScale = rand(0.85, 1.15).toFixed(2);

    // random left spawn across the screen
    const left = rand(0, window.innerWidth) + 'px';
    p.style.left = left;
    p.style.top = '-80px';

    // set CSS variables used by keyframes
    p.style.setProperty('--start-x', startX);
    p.style.setProperty('--sway', sway);
    p.style.setProperty('--start-rot', startRot);
    p.style.setProperty('--start-scale', startScale);

    // random duration and easing to feel natural
    const duration = rand(3.8, 6.2).toFixed(2) + 's';
    p.style.animation = `leafFall ${duration} linear forwards`;

    // slight horizontal jitter via transform translateX on creation for variety
    p.style.transform = `translateX(${rand(-8,8)}px)`;

    document.body.appendChild(p);

    // remove after life
    setTimeout(()=> {
      if(p && p.parentNode) p.parentNode.removeChild(p);
    }, life + 800);
  }

  setInterval(spawnPetal, spawnInterval);
  for(let i=0;i<6;i++) setTimeout(spawnPetal, i*120);
})();

/* ---------------------------
   Cursor water trail (realistic water path)
----------------------------*/
(function(){
  let last = {x: window.innerWidth/2, y: window.innerHeight/2};
  const spacing = 8; // minimum px movement to spawn a new blob

  document.addEventListener('mousemove', e=>{
    const dx = e.clientX - last.x;
    const dy = e.clientY - last.y;
    const dist = Math.hypot(dx, dy);

    if(dist > spacing){
      const steps = Math.ceil(dist / spacing);
      for(let i=0;i<steps;i++){
        const t = (i+1)/steps;
        const bx = last.x + dx * t;
        const by = last.y + dy * t;
        createWaterBlob(bx, by, dx, dy);
      }
      last.x = e.clientX;
      last.y = e.clientY;
    }
  });

  function createWaterBlob(x, y, dx, dy){
    const blob = document.createElement('div');
    blob.className = 'cursor-water';

    const speed = Math.hypot(dx, dy);
    const size = clamp(10 + speed * 0.5, 10, 36);
    blob.style.width = size + 'px';
    blob.style.height = size + 'px';

    const offsetX = -dx * 0.02 + rand(-6,6);
    const offsetY = -dy * 0.02 + rand(-6,6);

    blob.style.left = (x + offsetX - size/2) + 'px';
    blob.style.top = (y + offsetY - size/2) + 'px';
    document.body.appendChild(blob);

    requestAnimationFrame(()=>{
      blob.style.transform = 'scale(1.8)';
      blob.style.opacity = '0';
    });

    setTimeout(()=> {
      if(blob && blob.parentNode) blob.parentNode.removeChild(blob);
    }, 700 + rand(0,200));
  }

  document.addEventListener('touchstart', ()=>{ document.body.style.cursor = 'default'; }, {passive:true});
})();

/* ---------------------------
   Water ripple + droplets on background click
----------------------------*/
(function(){
  document.addEventListener('click', e=>{
    // ignore clicks on UI elements (buttons, links)
    if(e.target.closest('.btn') || e.target.closest('a')) return;

    const cx = e.clientX;
    const cy = e.clientY;

    // create 3 concentric rings with staggered timing
    for(let i=0;i<3;i++){
      const ring = document.createElement('div');
      ring.className = 'ripple-ring';
      const baseSize = 60 + i*48;
      ring.style.width = baseSize + 'px';
      ring.style.height = baseSize + 'px';
      ring.style.left = (cx - baseSize/2) + 'px';
      ring.style.top = (cy - baseSize/2) + 'px';
      ring.style.opacity = (0.9 - i*0.18).toString();
      ring.style.transition = `transform ${0.9 + i*0.12}s cubic-bezier(.2,.8,.2,1), opacity ${0.9 + i*0.12}s ease-out`;
      document.body.appendChild(ring);

      setTimeout(()=>{
        ring.style.transform = 'scale(3.2)';
        ring.style.opacity = '0';
      }, 30 + i*90);

      setTimeout(()=> { if(ring.parentNode) ring.parentNode.removeChild(ring); }, 1200 + i*200);
    }

    // spawn several small droplets that pop up and fall back
    const drops = Math.round(rand(6,12));
    for(let i=0;i<drops;i++){
      spawnWaterDrop(cx, cy);
    }
  });

  function spawnWaterDrop(cx, cy){
    const drop = document.createElement('div');
    drop.className = 'water-drop';
    const size = rand(6,10);
    drop.style.width = size + 'px';
    drop.style.height = size + 'px';

    const startX = cx + rand(-22,22);
    const startY = cy + rand(-8,8);
    drop.style.left = (startX - size/2) + 'px';
    drop.style.top = (startY - size/2) + 'px';
    document.body.appendChild(drop);

    const rise = rand(28, 90);
    const horiz = rand(-48, 48);
    const duration = rand(700, 1200);

    const start = performance.now();
    function animate(now){
      const t = clamp((now - start) / duration, 0, 1);
      const easeUp = 1 - Math.pow(1 - t, 3);
      const y = startY - rise * easeUp + (t * t * 18);
      const x = startX + horiz * easeUp;
      drop.style.left = (x - size/2) + 'px';
      drop.style.top = (y - size/2) + 'px';
      drop.style.opacity = String(1 - t);

      if(t < 1) requestAnimationFrame(animate);
      else if(drop.parentNode) drop.parentNode.removeChild(drop);
    }
    requestAnimationFrame(animate);
  }
})();

/* ---------------------------
   Keep things responsive on resize
----------------------------*/
window.addEventListener('resize', ()=> {
  // nothing to recalc for now; petal spawns use window.innerWidth each time
});
</script>
</body>
</html>
