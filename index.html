<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet — Home</title>

<style>
  :root{
    --bg:#050506;
    --text:#e9e6ef;
    --muted:#9a8fb8;
    --accent:#ffffff;
    font-family:Inter,system-ui;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    cursor:none; /* hide default cursor */
  }

  /* Water after-aura cursor trail */
  .cursor-water{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(150,150,180,0.6), rgba(60,60,80,0));
    pointer-events:none;
    filter:blur(4px);
    opacity:0.9;
    transform:scale(0.8);
    transition:opacity 0.5s ease-out, transform 0.5s ease-out;
    z-index:9999;
  }

  /* Water ripple on click */
  .water-ripple{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(180,180,200,0.5), rgba(80,80,100,0));
    pointer-events:none;
    filter:blur(4px);
    opacity:0.8;
    transform:scale(0.2);
    transition:transform 0.6s ease-out, opacity 0.6s ease-out;
    z-index:9998;
  }

  /* Falling Black Velvet Petals */
  .falling-petal{
    position:absolute;
    width:34px;
    height:52px;
    border-radius:50% 50% 40% 60%;
    background:linear-gradient(135deg, rgba(30,30,30,0.95), rgba(60,60,60,0.85));
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.7));
    pointer-events:none;
    animation:petalFall 4.5s linear forwards;
    opacity:0.9;
  }

  @keyframes petalFall{
    0%{ transform:translateY(-60px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(120deg); opacity:0; }
  }

  /* Black Velvet Flower */
  .velvet-flower{
    position:absolute;
    width:320px;
    height:320px;
    pointer-events:none;
    z-index:0;
    opacity:0.35;
    transition:opacity 0.6s ease-out, transform 0.6s ease-out;
  }

  .petal-shape{
    position:absolute;
    width:140px;
    height:210px;
    background:linear-gradient(135deg,#0a0a0a,#1c1c1c);
    border-radius:50% 50% 40% 60%;
    filter:drop-shadow(0 0 22px rgba(0,0,0,0.8));
  }

  .petal1{ transform:rotate(0deg) translateY(-110px); }
  .petal2{ transform:rotate(72deg) translateY(-110px); }
  .petal3{ transform:rotate(144deg) translateY(-110px); }
  .petal4{ transform:rotate(216deg) translateY(-110px); }
  .petal5{ transform:rotate(288deg) translateY(-110px); }

  .flower-center{
    position:absolute;
    width:110px;
    height:110px;
    background:#0d0d0d;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 32px rgba(255,255,255,0.15);
  }

  /* Page content */
  .page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    position:relative;
    z-index:2;
    transform:translateX(-30px);
  }

  h1{
    font-size:42px;
    margin:0;
    color:var(--accent);
    text-shadow:0 0 12px rgba(255,255,255,0.8);
  }

  p{
    margin-top:10px;
    font-size:16px;
    color:var(--muted);
  }

  .btn{
    padding:12px 20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    box-shadow:
      0 0 12px rgba(255,255,255,0.6),
      0 0 22px rgba(255,255,255,0.4),
      inset 0 0 12px rgba(255,255,255,0.3);
    transition:0.25s;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 0 18px rgba(255,255,255,0.9),
      0 0 32px rgba(255,255,255,0.7),
      inset 0 0 18px rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<!-- Black Velvet Flower -->
<div id="velvetFlower" class="velvet-flower">
  <div class="petal-shape petal1"></div>
  <div class="petal-shape petal2"></div>
  <div class="petal-shape petal3"></div>
  <div class="petal-shape petal4"></div>
  <div class="petal-shape petal5"></div>
  <div class="flower-center"></div>
</div>

<div class="page">
  <h1>Black Velvet</h1>
  <p>Welcome to the official clan hub.</p>

  <div style="display:flex; flex-direction:column; gap:14px; margin-top:24px; width:240px;">
    <a href="ranks.html" class="btn">Clan Ranks</a>
    <a href="rules.html" class="btn">Rules</a>
    <a href="information.html" class="btn">Information</a>
    <a href="staffapply.html" class="btn">Apply for Staff</a>
    <a href="staffpanel.html" class="btn">Staff Login</a>
  </div>
</div>

<script>
/* Cursor water after-aura */
document.addEventListener("mousemove", e=>{
  const blob = document.createElement("div");
  blob.className = "cursor-water";
  blob.style.left = (e.clientX - 10) + "px";
  blob.style.top = (e.clientY - 10) + "px";
  document.body.appendChild(blob);

  setTimeout(()=>{
    blob.style.opacity = "0";
    blob.style.transform = "scale(1.6)";
  }, 20);

  setTimeout(()=> blob.remove(), 600);
});

/* Water ripple on background click */
document.addEventListener("click", e=>{
  if(e.target.closest(".btn")) return;

  const ripple = document.createElement("div");
  ripple.className = "water-ripple";
  ripple.style.left = (e.clientX - 35) + "px";
  ripple.style.top = (e.clientY - 35) + "px";
  document.body.appendChild(ripple);

  setTimeout(()=>{
    ripple.style.transform = "scale(2)";
    ripple.style.opacity = "0";
  }, 20);

  setTimeout(()=> ripple.remove(), 700);
});

/* Falling petals */
(function(){
  function spawnFallingPetal(){
    const p = document.createElement("div");
    p.className = "falling-petal";
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = "-60px";
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 5000);
  }
  setInterval(spawnFallingPetal, 250);
})();

/* Flower: 5s visible → disappear → 5s later respawn */
(function(){
  const flower = document.getElementById("velvetFlower");

  function spawnFlower(){
    const maxX = window.innerWidth - 320;
    const maxY = window.innerHeight - 320;
    flower.style.left = Math.random() * maxX + "px";
    flower.style.top = Math.random() * maxY + "px";
  }

  function cycleFlower(){
    spawnFlower();
    flower.style.opacity = "0.35";
    flower.style.transform = "scale(1)";

    setTimeout(()=>{
      flower.style.opacity = "0";
      flower.style.transform = "scale(0.6)";
    }, 5000);

    setTimeout(cycleFlower, 10000);
  }

  cycleFlower();
})();
</script>

</body>
</html>
