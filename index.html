<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet — Home</title>

<style>
  :root{
    --bg:#050506;
    --text:#e9e6ef;
    --muted:#9a8fb8;
    --accent:#ffffff;
    --glass:rgba(255,255,255,0.03);
    font-family:Inter,system-ui;
  }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }

  /* Floating Black Velvet Flower (tap to respawn) */
  .velvet-flower{
    position:absolute;
    width:320px;
    height:320px;
    pointer-events:auto;
    z-index:0;
    opacity:0.35;
    transition:transform 0.4s ease-out, left 0.8s ease-out, top 0.8s ease-out;
  }

  .petal-shape{
    position:absolute;
    width:140px;
    height:210px;
    background:linear-gradient(135deg,#0a0a0a,#1c1c1c);
    border-radius:50% 50% 40% 60%;
    filter:drop-shadow(0 0 22px rgba(0,0,0,0.8));
  }

  .petal1{ transform:rotate(0deg) translateY(-110px); }
  .petal2{ transform:rotate(72deg) translateY(-110px); }
  .petal3{ transform:rotate(144deg) translateY(-110px); }
  .petal4{ transform:rotate(216deg) translateY(-110px); }
  .petal5{ transform:rotate(288deg) translateY(-110px); }

  .flower-center{
    position:absolute;
    width:110px;
    height:110px;
    background:#0d0d0d;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 32px rgba(255,255,255,0.15);
  }

  /* Water droplet background */
  .droplet{
    position:absolute;
    width:6px;
    height:6px;
    background:rgba(180,180,180,0.25);
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    animation:dropFall 4s linear forwards;
  }

  @keyframes dropFall{
    0%{ transform:translateY(-20px) scale(1); opacity:0.8; }
    100%{ transform:translateY(120vh) scale(0.4); opacity:0; }
  }

  /* Page content shifted slightly left */
  .page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    position:relative;
    z-index:2;
    transform:translateX(-30px);
  }

  h1{
    font-size:42px;
    margin:0;
    color:var(--accent);
    letter-spacing:1px;
    text-shadow:0 0 12px rgba(255,255,255,0.8);
  }

  p{
    margin-top:10px;
    font-size:16px;
    color:var(--muted);
  }

  /* Water glow buttons */
  .btn{
    padding:12px 20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-weight:700;
    text-decoration:none;
    box-shadow:
      0 0 12px rgba(255,255,255,0.6),
      0 0 22px rgba(255,255,255,0.4),
      inset 0 0 12px rgba(255,255,255,0.3);
    transition:0.25s;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 0 18px rgba(255,255,255,0.9),
      0 0 32px rgba(255,255,255,0.7),
      inset 0 0 18px rgba(255,255,255,0.5);
  }

  /* Ambient petals */
  .petal{
    position:absolute;
    width:34px;
    height:52px;
    border-radius:50% 50% 40% 60% / 60% 60% 40% 40%;
    background:linear-gradient(135deg,rgba(18,18,18,0.98),rgba(36,36,36,0.9) 60%);
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.7));
    pointer-events:none;
    opacity:0.95;
    transform-origin:center;
    animation:floatUp 3.8s forwards cubic-bezier(.2,.8,.2,1);
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg) scale(1); opacity:1; }
    60%{ transform:translateY(-120px) rotate(40deg) scale(1.02); opacity:0.9; }
    100%{ transform:translateY(-300px) rotate(120deg) scale(0.9); opacity:0; }
  }

  /* Cursor-follow petals */
  .cursor-petal{
    position:absolute;
    width:28px;
    height:42px;
    border-radius:50% 50% 40% 60%;
    background:linear-gradient(135deg,rgba(20,20,20,0.95),rgba(40,40,40,0.85));
    filter:drop-shadow(0 8px 24px rgba(0,0,0,0.7));
    pointer-events:none;
    opacity:0.9;
    transition:transform 0.25s ease-out, opacity 0.4s ease-out;
  }
</style>
</head>
<body>

<!-- Floating Black Velvet Flower (Tap to Respawn + Sound) -->
<div id="velvetFlower" class="velvet-flower">
  <div class="petal-shape petal1"></div>
  <div class="petal-shape petal2"></div>
  <div class="petal-shape petal3"></div>
  <div class="petal-shape petal4"></div>
  <div class="petal-shape petal5"></div>
  <div class="flower-center"></div>
</div>

<div id="petalLayer"></div>
<div id="cursorLayer"></div>
<div id="dropletLayer"></div>

<div class="page">
  <h1>Black Velvet</h1>
  <p>Welcome to the official clan hub.</p>

  <div style="display:flex; flex-direction:column; gap:14px; margin-top:24px; width:240px;">
    <a href="ranks.html" class="btn">Clan Ranks</a>
    <a href="rules.html" class="btn">Rules</a>
    <a href="information.html" class="btn">Information</a>
    <a href="staffapply.html" class="btn">Apply for Staff</a>
    <a href="staffpanel.html" class="btn">Staff Login</a>
  </div>
</div>

<script>
/* Ambient Petals */
(function(){
  const layer = document.getElementById('petalLayer');
  function rand(min,max){ return Math.random()*(max-min)+min; }

  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = rand(30,44);
    p.style.width = size + 'px';
    p.style.height = (size * 1.45) + 'px';
    p.style.left = rand(0, window.innerWidth) + 'px';
    p.style.top = (window.innerHeight + 40) + 'px';
    layer.appendChild(p);
    setTimeout(()=> p.remove(), 4200);
  }

  setInterval(spawnPetal, 350);
})();

/* Cursor-follow petals */
(function(){
  const cursorLayer = document.getElementById('cursorLayer');

  document.addEventListener('mousemove', e=>{
    const p = document.createElement('div');
    p.className = 'cursor-petal';
    p.style.left = (e.clientX - 14) + 'px';
    p.style.top = (e.clientY - 21) + 'px';

    cursorLayer.appendChild(p);

    setTimeout(()=>{
      p.style.opacity = 0;
      p.style.transform = 'scale(0.6) translateY(-20px)';
    }, 50);

    setTimeout(()=> p.remove(), 600);
  });
})();

/* Water Droplet Background */
(function(){
  const layer = document.getElementById('dropletLayer');
  function rand(min,max){ return Math.random()*(max-min)+min; }

  function spawnDroplet(){
    const d = document.createElement('div');
    d.className = 'droplet';
    d.style.left = rand(0, window.innerWidth) + 'px';
    d.style.top = rand(-40, -10) + 'px';
    layer.appendChild(d);
    setTimeout(()=> d.remove(), 4000);
  }

  setInterval(spawnDroplet, 120);
})();

/* Black Velvet Flower Respawn + Click Sound */
(function(){
  const flower = document.getElementById("velvetFlower");
  const clickSound = new Audio("sounds/click.mp3");

  function randomPos(){
    const maxX = window.innerWidth - 320;
    const maxY = window.innerHeight - 320;
    const x = Math.random() * (maxX > 0 ? maxX : 0);
    const y = Math.random() * (maxY > 0 ? maxY : 0);
    flower.style.left = x + "px";
    flower.style.top = y + "px";
  }

  // Initial spawn
  randomPos();

  // Gentle drifting (small transform only)
  setInterval(()=>{
    const driftX = (Math.random() * 40) - 20;
    const driftY = (Math.random() * 40) - 20;
    flower.style.transform = `translate(${driftX}px, ${driftY}px)`;
  }, 2000);

  // Respawn + click sound
  flower.addEventListener("click", ()=>{
    clickSound.currentTime = 0;
    clickSound.play();

    flower.style.transform = "scale(0.7)";
    setTimeout(()=>{
      randomPos();
      flower.style.transform = "scale(1)";
    }, 300);
  });

  // Reposition on resize so it doesn't go off-screen
  window.addEventListener("resize", randomPos);
})();
</script>

</body>
</html>
