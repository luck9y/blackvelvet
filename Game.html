<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204"><title>Black Velvet | Games</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Orbitron,Arial,sans-serif}main{position:relative;z-index:1;width:min(1000px,90%);margin:auto;padding:45px 0 75px}.top{display:flex;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}a{color:var(--silver);font-size:11px;letter-spacing:1.5px;text-decoration:none}.eyebrow{margin:58px 0 15px;color:var(--silver);font-size:11px;letter-spacing:3px}h1{margin:0;font:clamp(42px,8vw,75px) Cinzel,Georgia,serif;letter-spacing:4px}.intro{color:#aab5bc;font:16px/1.8 Arial,sans-serif}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.game{padding:25px;border:1px solid var(--line);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--silver);background:rgba(7,11,15,.88);font-size:12px;letter-spacing:1px}@media(max-width:700px){.games{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main>
    <header class="top"><a href="home.html">← BLACK VELVET HOME</a><a href="rankings.html">RANKINGS</a></header>
    <p class="eyebrow">BLACK VELVET // GAME NETWORK</p><h1>GAMES</h1>
    <p class="intro">Game hubs are being prepared. Rankings are available now.</p>
    <section class="games"><div class="game">MINECRAFT<br>JAVA</div><div class="game">MINECRAFT<br>BEDROCK</div><div class="game">VALORANT</div><div class="game">FORTNITE</div><div class="game">ROBLOX</div><div class="game">ROCKET LEAGUE</div></section>
  </main>
  <script src="theme.js"></script>
</body>
</html>
