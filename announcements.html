<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204">
  <title>Black Velvet | Announcements</title>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Orbitron, Arial, sans-serif;
    }

    main {
      width: min(920px, 92%);
      margin: auto;
      padding: 38px 0 80px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    a,
    button {
      color: var(--silver);
      font: 11px Orbitron, Arial, sans-serif;
      letter-spacing: 1.5px;
    }

    a {
      text-decoration: none;
    }

    button {
      padding: 0;
      border: 0;
      color: #aab5bc;
      background: transparent;
      cursor: pointer;
    }

    a:hover,
    button:hover {
      color: #ffffff;
    }

    .eyebrow {
      margin: 54px 0 13px;
      color: var(--silver);
      font-size: 11px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(38px, 8vw, 72px);
      letter-spacing: 4px;
    }

    .intro {
      max-width: 720px;
      margin: 18px 0 35px;
      color: #aab5bc;
      font: 16px/1.8 Arial, sans-serif;
    }

    #announcementStatus {
      min-height: 24px;
      margin: 0 0 18px;
      color: #aab5bc;
      font: 13px/1.5 Arial, sans-serif;
    }

    #announcementStatus.error {
      color: #e7a4a4;
    }

    .announcement-list {
      display: grid;
      gap: 18px;
    }

    .announcement-card {
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(7, 11, 15, .9);
    }

    .announcement-card h2 {
      margin: 0;
      color: var(--text);
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: 1.5px;
      overflow-wrap: anywhere;
    }

    .announcement-meta {
      margin: 9px 0 19px;
      color: #7f8992;
      font: 11px/1.5 Orbitron, Arial, sans-serif;
      letter-spacing: 1px;
    }

    .announcement-message {
      margin: 0;
      color: #d5d9dc;
      font: 15px/1.75 Arial, sans-serif;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .announcement-link {
      display: inline-block;
      margin-top: 19px;
      padding: 10px 13px;
      border: 1px solid #454d56;
      border-radius: 6px;
      color: #e7eaed;
      background: #151a1f;
      font-size: 10px;
      overflow-wrap: anywhere;
    }

    .announcement-media {
      display: block;
      width: 100%;
      max-height: 520px;
      margin-top: 20px;
      border: 1px solid #30373e;
      border-radius: 8px;
      background: #000000;
      object-fit: contain;
    }

    .empty-state {
      padding: 34px 24px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: #8e989f;
      font: 14px/1.7 Arial, sans-serif;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .announcement-card {
        padding: 19px;
      }
    }
  </style>
</head>

<body>
  <main id="page" hidden>
    <header class="top">
      <a href="home.html">← BLACK VELVET HOME</a>

      <div class="top-links">
        <a href="profile.html">PROFILE</a>
        <button id="logoutButton" type="button">LOG OUT</button>
      </div>
    </header>

    <p class="eyebrow">BLACK VELVET // MEMBER NETWORK</p>
    <h1>ANNOUNCEMENTS</h1>

    <p class="intro">
      Official Black Velvet updates. This page is available only to
      signed-in members.
    </p>

    <p
      id="announcementStatus"
      role="status"
      aria-live="polite"
    >
      Loading announcements...
    </p>

    <section
      id="announcementList"
      class="announcement-list"
      aria-label="Black Velvet announcements"
    ></section>
  </main>

  <script src="theme.js"></script>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://ptgzhljvzyceawwohmym.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk";
    const AUTH_STORAGE_KEY = "black-velvet-supabase-auth";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        storage: window.localStorage,
        storageKey: AUTH_STORAGE_KEY,
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const page = document.getElementById("page");
    const list = document.getElementById("announcementList");
    const status = document.getElementById("announcementStatus");
    const logoutButton = document.getElementById("logoutButton");

    let announcements = [];
    let refreshTimer = null;

    function redirectToLogin() {
      sessionStorage.setItem(
        "blackVelvetLoginReturnTo",
        location.href
      );

      location.replace("member-login.html");
    }

    function formatDate(value) {
      if (!value) {
        return "Recently posted";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Recently posted";
      }

      return date.toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function getLinkName(link) {
      try {
        return new URL(link).hostname.replace(/^www\./i, "");
      } catch {
        return "OPEN LINK";
      }
    }

    function createAnnouncementCard(announcement) {
      const card = document.createElement("article");
      card.className = "announcement-card";
      card.dataset.id = String(announcement.id || "");

      const title = document.createElement("h2");
      title.textContent = announcement.title || "Announcement";

      const meta = document.createElement("p");
      meta.className = "announcement-meta";
      meta.textContent =
        `BY ${announcement.discord_username || "BLACK VELVET"} · ` +
        formatDate(announcement.created_at);

      const message = document.createElement("p");
      message.className = "announcement-message";
      message.textContent = announcement.message || "";

      card.append(title, meta, message);

      if (announcement.link) {
        const link = document.createElement("a");
        link.className = "announcement-link";
        link.href = announcement.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = getLinkName(announcement.link).toUpperCase();
        card.appendChild(link);
      }

      if (
        announcement.media_url &&
        String(announcement.media_type || "").startsWith("image/")
      ) {
        const image = document.createElement("img");
        image.className = "announcement-media";
        image.src = announcement.media_url;
        image.alt = announcement.title || "Announcement image";
        image.loading = "lazy";
        card.appendChild(image);
      }

      if (
        announcement.media_url &&
        String(announcement.media_type || "").startsWith("video/")
      ) {
        const video = document.createElement("video");
        video.className = "announcement-media";
        video.src = announcement.media_url;
        video.controls = true;
        video.preload = "metadata";
        card.appendChild(video);
      }

      return card;
    }

    function renderAnnouncements() {
      list.replaceChildren();

      if (announcements.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No announcements have been posted yet.";
        list.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const announcement of announcements) {
        fragment.appendChild(
          createAnnouncementCard(announcement)
        );
      }

      list.appendChild(fragment);
    }

    async function loadAnnouncements(showLoading = false) {
      if (showLoading) {
        status.className = "";
        status.textContent = "Loading announcements...";
      }

      const { data, error } = await supabase
        .from("announcements")
        .select(
          "id, title, message, discord_username, link, media_url, media_type, media_name, created_at"
        )
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        console.error("Announcement loading failed:", error);
        status.className = "error";
        status.textContent =
          "Announcements could not be loaded. Check the member read policy.";
        return;
      }

      announcements = data || [];
      renderAnnouncements();
      status.className = "";
      status.textContent = announcements.length
        ? `${announcements.length} announcement${
            announcements.length === 1 ? "" : "s"
          }`
        : "";
    }

    function subscribeToAnnouncements() {
      supabase
        .channel("member-announcements")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "announcements"
          },
          payload => {
            const incoming = payload.new;

            if (
              incoming?.id &&
              announcements.some(item => item.id === incoming.id)
            ) {
              return;
            }

            announcements.unshift(incoming);
            renderAnnouncements();
          }
        )
        .subscribe();

      refreshTimer = window.setInterval(() => {
        loadAnnouncements(false);
      }, 30_000);
    }

    async function unlockPage() {
      const {
        data: { user },
        error
      } = await supabase.auth.getUser();

      if (error || !user) {
        redirectToLogin();
        return;
      }

      page.hidden = false;
      await loadAnnouncements(true);
      subscribeToAnnouncements();
    }

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;

      if (refreshTimer) {
        clearInterval(refreshTimer);
      }

      await supabase.auth.signOut();
      localStorage.removeItem("blackVelvetProfile");
      location.replace("member-login.html");
    });

    unlockPage();
  </script>
</body>
</html>
