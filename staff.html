    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
        line-height: 1.6;
        position: relative;
    }

    .signature {
        position: absolute;
        top: 20px;

    h1 {

        font-size: 32px;
        margin-bottom: 30px;

        letter-spacing: 2px;
    }

    .staff-box {
        max-width: 900px;
        margin: auto;
        background: #1a1a1a;
        padding: 25px;
        border-radius: 10px;
        border-left: 6px solid #ffffff;
        margin-bottom: 25px;
    }

    .staff-title {
        font-family: 'Press Start 2P', cursive;
        font-size: 18px;
        margin-bottom: 10px;
        color: #fff;

    }

    .staff-desc {
        font-size: 15px;
        color: #d0d0d0;
        line-height: 1.7;
    }

    .slot {
        font-size: 15px;
        color: #ccc;
        margin-left: 10px;
        margin-bottom: 6px;
    }

    .nav-buttons {
        max-width: 900px;
        margin: 40px auto 0 auto;
        display: flex;
        justify-content: space-between;
    }

    .nav-btn {
        background: #111;
        padding: 15px 20px;
        border-radius: 10px;
        border: 2px solid #444;
        text-align: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .nav-btn:hover {
        border-color: #ffffff;
        background: #222;
        transform: scale(1.03);
    }
</style>
</head>
