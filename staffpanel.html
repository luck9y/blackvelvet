<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Panel</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at top, #151515 0%, #050505 45%, #000000 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    cursor: none;
    color: #f5f5f5;
  }

  /* Falling velvet petals */
  .petal {
    position: fixed;
    top: -20px;
    width: 16px;
    height: 16px;
    background: rgba(40,40,40,0.85);
    border-radius: 50%;
    filter: blur(1px);
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-20px) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* Cursor flower core */
  #cursorFlower {
    position: fixed;
    width: 32px;
    height: 32px;
    background: radial-gradient(circle, #e4e4e4 0%, #9b9b9b 60%, #6b6b6b 100%);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 12px #d0d0d0);
    z-index: 9999;
  }

  /* Aura trail elements */
  .cursorTrail {
    position: fixed;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,180,180,0.35) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    filter: blur(10px);
    pointer-events: none;
    animation: trailFade 0.5s ease-out forwards;
    z-index: 9998;
  }
  @keyframes trailFade {
    from { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    to   { opacity: 0;   transform: translate(-50%, -50%) scale(1.3); }
  }

  /* Click ripple */
  .ripple {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(190,190,190,0.5);
    transform: translate(-50%, -50%);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 9997;
  }
  @keyframes rippleAnim {
    from { width: 10px; height: 10px; opacity: 0.8; }
    to   { width: 120px; height: 120px; opacity: 0; }
  }

  /* Futuristic glass login panel */
  #loginPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 380px;
    padding: 26px 26px 30px;
    background: linear-gradient(135deg, rgba(20,20,20,0.9), rgba(40,40,40,0.75));
    border-radius: 20px;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 25px rgba(200,200,200,0.18),
      0 0 80px rgba(120,120,120,0.25);
    border: 1px solid rgba(160,160,160,0.35);
    backdrop-filter: blur(12px);
    transition: transform 0.9s ease, opacity 0.9s ease, box-shadow 0.9s ease;
    z-index: 50;
  }

  #loginPanel.slideLeft {
    transform: translate(-130%, -50%) scale(0.95);
    opacity: 0;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }

  #loginTitle {
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #f0f0f0;
    text-shadow: 0 0 10px rgba(220,220,220,0.6);
  }

  .loginLabel {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 10px;
    color: #c0c0c0;
  }

  .loginInput {
    width: 100%;
    padding: 10px 12px;
    margin-top: 4px;
    border-radius: 12px;
    border: 1px solid rgba(150,150,150,0.4);
    background: radial-gradient(circle at top, rgba(25,25,25,0.95), rgba(15,15,15,0.95));
    color: #f5f5f5;
    outline: none;
    font-size: 13px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.7);
  }
  .loginInput::placeholder {
    color: #8f8f8f;
  }
  .loginInput:focus {
    border-color: rgba(210,210,210,0.8);
    box-shadow:
      inset 0 0 10px rgba(0,0,0,0.9),
      0 0 12px rgba(200,200,200,0.5);
  }

  #loginBtn {
    width: 100%;
    padding: 11px 0;
    margin-top: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #f0f0f0, #9c9c9c);
    color: #111;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      0 0 12px rgba(220,220,220,0.7),
      0 0 40px rgba(160,160,160,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  #loginBtn:hover {
    transform: translateY(-1px);
    background: linear-gradient(135deg, #ffffff, #b5b5b5);
    box-shadow:
      0 0 18px rgba(240,240,240,0.9),
      0 0 60px rgba(180,180,180,0.7);
  }
  #loginBtn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow:
      0 0 8px rgba(200,200,200,0.7),
      0 0 30px rgba(150,150,150,0.6);
  }

  /* Futuristic staff content panel */
  #staffContent {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 78%;
    height: 68%;
    transform: translate(-50%, -50%);
    background: linear-gradient(145deg, rgba(18,18,18,0.95), rgba(30,30,30,0.85));
    border-radius: 24px;
    border: 1px solid rgba(160,160,160,0.35);
    box-shadow:
      0 0 30px rgba(200,200,200,0.18),
      0 0 90px rgba(120,120,120,0.25);
    backdrop-filter: blur(14px);
    display: none;
    padding: 22px;
    z-index: 40;
  }

  #staffHeader {
    font-size: 24px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(220,220,220,0.7);
    margin-bottom: 8px;
  }

  #staffSub {
    font-size: 13px;
    color: #c7c7c7;
    letter-spacing: 1px;
  }

  #panelText {
    margin-top: 26px;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e0e0e0;
    text-shadow: 0 0 10px rgba(220,220,220,0.6);
  }

  /* Bottom futuristic buttons */
  #bottomButtons {
    position: fixed;
    bottom: 24px;
    width: 100%;
    text-align: center;
    display: none;
    z-index: 45;
  }

  .panelBtn {
    display: inline-block;
    padding: 10px 18px;
    margin: 0 8px;
    border-radius: 14px;
    border: 1px solid rgba(160,160,160,0.5);
    background: radial-gradient(circle at top, rgba(25,25,25,0.95), rgba(10,10,10,0.95));
    color: #f5f5f5;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(160,160,160,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .panelBtn:hover {
    transform: translateY(-1px);
    background: radial-gradient(circle at top, rgba(40,40,40,0.95), rgba(15,15,15,0.95));
    border-color: rgba(210,210,210,0.8);
    box-shadow:
      0 0 18px rgba(220,220,220,0.7),
      0 0 40px rgba(160,160,160,0.6);
  }
  .panelBtn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 0 8px rgba(150,150,150,0.6);
  }
</style>
</head>
<body>

<!-- Cursor flower -->
<div id="cursorFlower"></div>

<!-- Login Panel -->
<div id="loginPanel">
  <div id="loginTitle">Staff Login</div>

  <div class="loginLabel">Username</div>
  <input id="userInput" class="loginInput" placeholder="Enter staff username">

  <div class="loginLabel">Passcode</div>
  <input id="passInput" class="loginInput" placeholder="Enter passcode">

  <button id="loginBtn">Unlock</button>
</div>

<!-- Staff Content -->
<div id="staffContent">
  <div id="staffHeader">Black Velvet Staff Panel</div>
  <div id="staffSub">Futuristic access • Velvet clan interface • All modules coming soon</div>
  <div id="panelText">COMING SOON — Panel 1</div>
</div>

<!-- Bottom Buttons -->
<div id="bottomButtons">
  <span class="panelBtn" data-panel="1">Panel 1</span>
  <span class="panelBtn" data-panel="2">Panel 2</span>
  <span class="panelBtn" data-panel="3">Panel 3</span>
  <span class="panelBtn" data-panel="4">Panel 4</span>
</div>

<script>
/* Falling petals */
for (let i = 0; i < 32; i++) {
  const p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (6 + Math.random() * 7) + "s";
  p.style.opacity = 0.35 + Math.random() * 0.4;
  document.body.appendChild(p);
}

/* Cursor flower + aura trail */
const cursorFlower = document.getElementById("cursorFlower");

document.addEventListener("mousemove", e => {
  const x = e.clientX;
  const y = e.clientY;

  cursorFlower.style.left = x + "px";
  cursorFlower.style.top = y + "px";

  const trail = document.createElement("div");
  trail.className = "cursorTrail";
  trail.style.left = x + "px";
  trail.style.top = y + "px";
  document.body.appendChild(trail);
  setTimeout(() => trail.remove(), 500);
});

/* Click ripple */
document.addEventListener("click", e => {
  const r = document.createElement("div");
  r.className = "ripple";
  r.style.left = e.clientX + "px";
  r.style.top = e.clientY + "px";
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 600);
});

/* Webhook + accounts */
const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

const accounts = {
  "gear10": "9033",
  "luckyy1": "0226",
  "suoaztic": "4423",
  "Staff1": "1",
  "flip2": "2",
  "fork3": "3",
  "an4": "4",
  "fin5": "5"
};

/* Persistent device hex */
function getDeviceHex() {
  if (!localStorage.deviceHex) {
    const hex = Math.floor(Math.random() * 0xFFFF)
      .toString(16)
      .toUpperCase()
      .padStart(4, "0");
    localStorage.deviceHex = hex;
  }
  return localStorage.deviceHex;
}

/* Fingerprint builder */
function getFingerprint() {
  return {
    browser: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    resolution: `${window.screen.width}x${window.screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    hex: getDeviceHex(),
    time: new Date().toString()
  };
}

/* Webhook sender */
function sendLoginWebhook(type, user, code, reason) {
  const fp = getFingerprint();

  const payload = {
    content:
`# ${type === "success" ? "Login Successful" : "Failed Login"}

**__Username__:** \`${user}\`
**__Code__:** \`${code}\`
**__Reason__:** \`${reason}\`

**__Device Hex__:** \`${fp.hex}\`
**__Browser__:** \`${fp.browser}\`
**__Language__:** \`${fp.language}\`
**__Platform__:** \`${fp.platform}\`
**__Resolution__:** \`${fp.resolution}\`
**__Time__:** \`${fp.time}\`
**__Time Zone__:** \`${fp.timezone}\`
`
  };

  fetch(webhookURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(() => {
    navigator.sendBeacon(webhookURL, JSON.stringify(payload));
  });
}

/* Login logic */
const loginPanel = document.getElementById("loginPanel");
const staffContent = document.getElementById("staffContent");
const bottomButtons = document.getElementById("bottomButtons");
const panelText = document.getElementById("panelText");
const loginBtn = document.getElementById("loginBtn");
const userInput = document.getElementById("userInput");
const passInput = document.getElementById("passInput");

loginBtn.addEventListener("click", () => {
  const user = userInput.value.trim();
  const code = passInput.value.trim();

  if (accounts[user] === code) {
    sendLoginWebhook("success", user, code, "Correct credentials");

    loginPanel.style.boxShadow =
      "0 0 40px rgba(240,240,240,0.9), 0 0 120px rgba(200,200,200,0.8)";

    setTimeout(() => {
      loginPanel.classList.add("slideLeft");
    }, 120);

    setTimeout(() => {
      loginPanel.style.display = "none";
      staffContent.style.display = "block";
      bottomButtons.style.display = "block";
    }, 950);
  } else {
    sendLoginWebhook("fail", user || "UNKNOWN", code, "Wrong username or code");
    alert("Incorrect login.");
  }
});

/* Panel switching */
bottomButtons.querySelectorAll(".panelBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    const num = btn.getAttribute("data-panel");
    panelText.innerText = "COMING SOON — Panel " + num;
  });
});
</script>

</body>
</html>
