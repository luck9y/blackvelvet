<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Black Velvet — Staff Panel</title>

  <style>
    :root{
      --bg:#050506;
      --panel:#0f0f11;
      --accent:#bfa6ff;
      --muted:#9a8fb8;
      --glass: rgba(255,255,255,0.03);
      --btn-bg: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
      --btn-border: rgba(255,255,255,0.06);
      --petal-dark: rgba(30,30,30,0.95);
      --petal-mid: rgba(18,18,18,0.85);
      --petal-edge: rgba(60,60,60,0.6);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(191,166,255,0.02), transparent 8%),
        radial-gradient(900px 500px at 90% 90%, rgba(255,120,150,0.01), transparent 6%),
        var(--bg);
      color:#e9e6ef;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
      box-sizing:border-box;
    }

    .card{
      width:980px;
      max-width:96%;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.18));
      border-radius:18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      display:grid;
      grid-template-columns: 320px 1fr;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
      position:relative;
    }

    .left{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.12));
      padding:28px;
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:center;
      justify-content:flex-start;
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:12px;
      background:linear-gradient(135deg, rgba(191,166,255,0.12), rgba(255,120,150,0.06));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      color:var(--accent);
      font-size:20px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .title{
      text-align:center;
      font-size:18px;
      color:#efeaf8;
      margin-top:6px;
    }

    .subtitle{
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    .main{
      padding:34px 36px;
      display:flex;
      flex-direction:column;
      gap:18px;
      position:relative;
      z-index:2;
    }

    .button-group{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
    }

    .btn{
      appearance:none;
      border:1px solid var(--btn-border);
      background:var(--btn-bg);
      color:#efeaf8;
      padding:12px 16px;
      border-radius:10px;
      font-size:14px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px) saturate(120%);
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .btn:hover{
      transform:translateY(-4px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    .icon{
      width:18px;
      height:18px;
      border-radius:4px;
      background:linear-gradient(180deg, var(--accent), #ff78a0);
      box-shadow: 0 4px 10px rgba(191,166,255,0.18);
    }

    .panel{
      margin-top:8px;
      background:var(--glass);
      border-radius:12px;
      padding:14px;
      color:var(--muted);
      font-size:13px;
      border:1px solid rgba(255,255,255,0.02);
    }

    .footer{
      margin-top:auto;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      padding-bottom:6px;
    }

    .petal-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }

    .petal{
      position:absolute;
      width:36px;
      height:56px;
      border-radius:50% 50% 40% 60% / 60% 60% 40% 40%;
      background: linear-gradient(135deg, var(--petal-dark), var(--petal-mid) 60%, var(--petal-edge));
      transform-origin:center;
      opacity:0.95;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
      mix-blend-mode:multiply;
      will-change: transform, opacity;
    }

    @keyframes petalFloat {
      0%{ transform: translateY(0) rotate(0deg) scale(1); opacity:1; }
      30%{ transform: translateY(-18px) rotate(15deg) scale(1.02); }
      60%{ transform: translateY(-60px) rotate(45deg) scale(.98); opacity:0.9; }
      100%{ transform: translateY(-220px) rotate(120deg) scale(.86); opacity:0; }
    }

    @media (prefers-reduced-motion: reduce){
      .petal{ animation:none !important; opacity:0; }
    }

    @media (max-width:880px){
      .card{ grid-template-columns:1fr; }
      .left{ flex-direction:row; gap:12px; padding:18px; }
      .logo{ width:84px; height:84px; font-size:16px; }
      .main{ padding:20px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="cardRoot">

      <aside class="left">
        <div class="logo">BV</div>
        <div class="title">Staff Panel</div>
        <div class="subtitle">Black Velvet Administration</div>
      </aside>

      <section class="main">
        <h2 style="margin:0;font-size:16px;color:#efeaf8;">Staff Controls</h2>

        <div class="button-group">
          <button class="btn">
            <span class="icon"></span>
            Panel 1 — Coming Soon
          </button>

          <button class="btn">
            <span class="icon"></span>
            Panel 2 — Coming Soon
          </button>

          <button class="btn">
            <span class="icon"></span>
            Panel 3 — Coming Soon
          </button>

          <button class="btn">
            <span class="icon"></span>
            Panel 4 — Coming Soon
          </button>
        </div>

        <div class="panel">
          <strong style="color:#efeaf8;">Staff Notice</strong>
          <div style="margin-top:6px;">
            All staff tools are currently locked. Panels will unlock as development continues.
          </div>
        </div>

        <div class="footer">
          <div>© <span id="year"></span> Black Velvet</div>
          <div style="opacity:.6;">•</div>
          <div style="opacity:.7;">Staff Access</div>
        </div>
      </section>

      <div class="petal-layer" id="petalLayer"></div>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const layer = document.getElementById('petalLayer');
    const card = document.getElementById('cardRoot');
    const MAX_PETALS = 28;
    let activePetals = 0;

    function rand(min,max){ return Math.random()*(max-min)+min; }

    function createPetal(x,y){
      if(activePetals >= MAX_PETALS) return;

      const petal = document.createElement('div');
      petal.className = 'petal';

      const w = Math.round(rand(18,48));
      const h = Math.round(rand(28,84));
      petal.style.width = w+'px';
      petal.style.height = h+'px';

      petal.style.left = (x-w/2)+'px';
      petal.style.top = (y-h/2)+'px';

      petal.style.transform = `rotate(${rand(-40,40)}deg)`;

      const duration = rand(2200,4200);
      const delay = rand(0,160);
      petal.style.animation = `petalFloat ${duration}ms cubic-bezier(.22,.9,.35,1) ${delay}ms forwards`;

      activePetals++;
      layer.appendChild(petal);

      setTimeout(()=>{
        if(petal.parentNode) petal.parentNode.removeChild(petal);
        activePetals = Math.max(0,activePetals-1);
      }, duration+delay+200);
    }

    function spawnBurst(clientX,clientY){
      const rect = layer.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const count = Math.floor(rand(3,8));
      for(let i=0;i<count;i++){
        const ox = rand(-18,18);
        const oy = rand(-18,18);
        setTimeout(()=>createPetal(x+ox,y+oy), Math.round(rand(0,120)));
      }
    }

    card.addEventListener('click', e=>{
      const tag = e.target.tagName.toLowerCase();
      if(tag === 'button' || e.target.closest('button')) return;
      spawnBurst(e.clientX,e.clientY);
    });
  </script>
</body>
</html>
