<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Panel</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
    cursor: none;
  }

  /* Falling velvet petals */
  .petal {
    position: fixed;
    top: -20px;
    width: 18px;
    height: 18px;
    background: rgba(40,40,40,0.8);
    border-radius: 50%;
    filter: blur(1px);
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-20px) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* Cursor aura */
  #cursorAura {
    position: fixed;
    width: 140px;
    height: 140px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(120,120,120,0.25) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    filter: blur(12px);
  }

  /* Cursor flower */
  #cursorFlower {
    position: fixed;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #dcdcdc, #8a8a8a);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 12px #ccc);
  }

  /* Water ripple click effect */
  .ripple {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(180,180,180,0.4);
    transform: translate(-50%, -50%);
    animation: rippleAnim 0.6s ease-out forwards;
  }
  @keyframes rippleAnim {
    from { width: 10px; height: 10px; opacity: 0.7; }
    to { width: 120px; height: 120px; opacity: 0; }
  }

  /* Login panel */
  #loginPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 360px;
    padding: 25px;
    background: rgba(15,15,15,0.9);
    border-radius: 18px;
    transform: translate(-50%, -50%);
    transition: all 1s ease;
    box-shadow: 0 0 25px #333;
  }

  #loginPanel.slideLeft {
    transform: translate(-120%, -50%);
    opacity: 0;
  }

  /* Staff content */
  #staffContent {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 80%;
    height: 70%;
    background: rgba(20,20,20,0.85);
    border-radius: 20px;
    transform: translate(-50%, -50%);
    display: none;
    color: white;
    padding: 20px;
    box-shadow: 0 0 25px #444;
  }

  /* Bottom buttons */
  #bottomButtons {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    display: none;
  }
  .panelBtn {
    padding: 12px 20px;
    margin: 0 10px;
    background: #111;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: .3s;
  }
  .panelBtn:hover {
    background: #333;
  }
</style>
</head>
<body>

<div id="cursorAura"></div>
<div id="cursorFlower"></div>

<!-- Login Panel -->
<div id="loginPanel">
  <h2 style="color:white;text-align:center;">Staff Login</h2>
  <input id="userInput" placeholder="Username" style="width:100%;padding:10px;margin-top:10px;">
  <input id="passInput" placeholder="Passcode" style="width:100%;padding:10px;margin-top:10px;">
  <button id="loginBtn" style="width:100%;padding:10px;margin-top:15px;">Unlock</button>
</div>

<!-- Staff Content -->
<div id="staffContent">
  <h1>Black Velvet Staff Panel</h1>
  <p>Select a panel below.</p>
  <div id="panelText" style="margin-top:20px;font-size:22px;">COMING SOON</div>
</div>

<!-- Bottom Buttons -->
<div id="bottomButtons">
  <span class="panelBtn" onclick="switchPanel(1)">Panel 1</span>
  <span class="panelBtn" onclick="switchPanel(2)">Panel 2</span>
  <span class="panelBtn" onclick="switchPanel(3)">Panel 3</span>
  <span class="panelBtn" onclick="switchPanel(4)">Panel 4</span>
</div>

<script>
/* Generate falling petals */
for (let i = 0; i < 30; i++) {
  let p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (4 + Math.random() * 6) + "s";
  p.style.opacity = 0.4 + Math.random() * 0.4;
  document.body.appendChild(p);
}

/* Cursor movement */
document.addEventListener("mousemove", e => {
  cursorFlower.style.left = e.clientX + "px";
  cursorFlower.style.top = e.clientY + "px";

  cursorAura.style.left = e.clientX + "px";
  cursorAura.style.top = e.clientY + "px";
});

/* Water ripple click */
document.addEventListener("click", e => {
  let r = document.createElement("div");
  r.className = "ripple";
  r.style.left = e.clientX + "px";
  r.style.top = e.clientY + "px";
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 600);
});

/* Webhook + login system */
const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

const accounts = {
  "gear10": "9033",
  "luckyy1": "0226",
  "suoaztic": "4423",
  "Staff1": "1",
  "flip2": "2",
  "fork3": "3",
  "an4": "4",
  "fin5": "5"
};

function sendWebhook(user, code) {
  fetch(webhookURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: `Login Attempt\nUser: ${user}\nCode: ${code}`
    })
  });
}

loginBtn.addEventListener("click", () => {
  const user = userInput.value;
  const code = passInput.value;

  if (accounts[user] === code) {
    sendWebhook(user, code);

    loginPanel.classList.add("slideLeft");

    setTimeout(() => {
      loginPanel.style.display = "none";
      staffContent.style.display = "block";
      bottomButtons.style.display = "block";
    }, 900);

  } else {
    alert("Incorrect login.");
    sendWebhook(user, "WRONG");
  }
});

/* Panel switching */
function switchPanel(num) {
  panelText.innerText = "COMING SOON — Panel " + num;
}
</script>

</body>
</html>
