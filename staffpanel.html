<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Panel</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #0a0a0a;
    font-family: Arial, sans-serif;
  }

  /* Falling petals */
  .petal {
    position: fixed;
    top: -10px;
    width: 20px;
    height: 20px;
    background: rgba(150, 0, 150, 0.7);
    border-radius: 50%;
    filter: blur(1px);
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-20px) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* Water aura */
  .aura {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(180,180,200,0.15) 0%, transparent 70%);
    animation: water 6s ease-in-out infinite;
  }
  @keyframes water {
    0% { transform: scale(1); opacity: .4; }
    50% { transform: scale(1.1); opacity: .6; }
    100% { transform: scale(1); opacity: .4; }
  }

  /* Cursor flower */
  body {
    cursor: none;
  }
  #cursorFlower {
    position: fixed;
    width: 35px;
    height: 35px;
    background: radial-gradient(circle, #ffffff, #cccccc);
    border-radius: 50%;
    pointer-events: none;
    filter: drop-shadow(0 0 10px #ccc);
    transform: translate(-50%, -50%);
  }

  /* Login panel */
  #loginPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 350px;
    padding: 25px;
    background: rgba(20,20,20,0.9);
    border-radius: 15px;
    transform: translate(-50%, -50%);
    transition: all 1s ease;
    box-shadow: 0 0 20px #444;
  }

  #loginPanel.slideLeft {
    transform: translate(-120%, -50%);
    opacity: 0;
  }

  #staffContent {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 80%;
    height: 70%;
    background: rgba(30,30,30,0.85);
    border-radius: 20px;
    transform: translate(-50%, -50%);
    display: none;
    color: white;
    padding: 20px;
    box-shadow: 0 0 25px #555;
  }

  /* Bottom buttons */
  #bottomButtons {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
  }
  .panelBtn {
    padding: 12px 20px;
    margin: 0 10px;
    background: #222;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: .3s;
  }
  .panelBtn:hover {
    background: #444;
  }
</style>
</head>
<body>

<div class="aura"></div>
<div id="cursorFlower"></div>

<!-- Login Panel -->
<div id="loginPanel">
  <h2 style="color:white;text-align:center;">Staff Login</h2>
  <input id="userInput" placeholder="Username" style="width:100%;padding:10px;margin-top:10px;">
  <input id="passInput" placeholder="Passcode" style="width:100%;padding:10px;margin-top:10px;">
  <button id="loginBtn" style="width:100%;padding:10px;margin-top:15px;">Unlock</button>
</div>

<!-- Staff Content -->
<div id="staffContent">
  <h1>Black Velvet Staff Panel</h1>
  <p>Select a panel below.</p>
  <div id="panelText" style="margin-top:20px;font-size:22px;">COMING SOON</div>
</div>

<!-- Bottom Buttons -->
<div id="bottomButtons" style="display:none;">
  <span class="panelBtn" onclick="switchPanel(1)">Panel 1</span>
  <span class="panelBtn" onclick="switchPanel(2)">Panel 2</span>
  <span class="panelBtn" onclick="switchPanel(3)">Panel 3</span>
  <span class="panelBtn" onclick="switchPanel(4)">Panel 4</span>
</div>

<script>
/* Falling petals generator */
for (let i = 0; i < 25; i++) {
  let p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (4 + Math.random() * 6) + "s";
  document.body.appendChild(p);
}

/* Cursor flower movement */
document.addEventListener("mousemove", e => {
  const c = document.getElementById("cursorFlower");
  c.style.left = e.clientX + "px";
  c.style.top = e.clientY + "px";
});

/* Webhook + login system */
const webhookURL = "https://discord.com/api/webhooks/1537233521410576546/qoHYqRmP1SbBfuuMCzvJBxWgTIGIlKpS3bhQ7xuj2MnbxNSoRGu0xUxCzkiXV6d43DIs";

const accounts = {
  "gear10": "9033",
  "luckyy1": "0226",
  "suoaztic": "4423",
  "Staff1": "1",
  "flip2": "2",
  "fork3": "3",
  "an4": "4",
  "fin5": "5"
};

function sendWebhook(user, code) {
  fetch(webhookURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: `Login Attempt\nUser: ${user}\nCode: ${code}`
    })
  });
}

document.getElementById("loginBtn").addEventListener("click", () => {
  const user = document.getElementById("userInput").value;
  const code = document.getElementById("passInput").value;

  if (accounts[user] === code) {
    sendWebhook(user, code);

    const panel = document.getElementById("loginPanel");
    panel.classList.add("slideLeft");

    setTimeout(() => {
      panel.style.display = "none";
      document.getElementById("staffContent").style.display = "block";
      document.getElementById("bottomButtons").style.display = "block";
    }, 900);

  } else {
    alert("Incorrect login.");
    sendWebhook(user, "WRONG");
  }
});

/* Panel switching */
function switchPanel(num) {
  document.getElementById("panelText").innerText = "COMING SOON — Panel " + num;
}
</script>

</body>
</html>
