<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Passcode — Black Velvet</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 80px;
    }

    h1 {
        font-family: 'Press Start 2P', cursive;
        font-size: 26px;
        margin-bottom: 30px;
        text-shadow: 0 0 10px #fff;
    }

    input {
        width: 250px;
        padding: 15px;
        background: #111;
        border: 2px solid #444;
        border-radius: 8px;
        color: white;
        font-family: 'Press Start 2P', cursive;
        font-size: 16px;
        text-align: center;
        box-shadow: 0 0 12px #ffffff55;
    }

    input:focus {
        outline: none;
        border-color: #fff;
        box-shadow: 0 0 18px #ffffffaa;
    }

    button {
        margin-top: 25px;
        width: 250px;
        padding: 15px;
        background: #222;
        border: 2px solid #fff;
        border-radius: 8px;
        font-family: 'Press Start 2P', cursive;
        color: white;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 0 12px #ffffff55;
        transition: 0.2s;
    }

    button:hover {
        background: #333;
        box-shadow: 0 0 18px #ffffffaa;
        transform: scale(1.05);
    }

    #error {
        margin-top: 20px;
        color: red;
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        text-shadow: 0 0 10px #ff0000aa;
    }
</style>
</head>

<body>

<h1>ENTER STAFF PASSCODE</h1>

<input id="passcode" type="password" placeholder="••••">

<button onclick="checkPass()">ENTER</button>

<div id="error"></div>

<script>
function checkPass() {
    const code = document.getElementById("passcode").value;

    if (code === "9033") {
        window.location.href = "stafflogs.html";
    } else {
        document.getElementById("error").innerText = "Incorrect passcode.";
    }
}
</script>

</body>
</html>
