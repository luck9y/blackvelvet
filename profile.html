<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204"><title>Black Velvet | Player Profile</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Orbitron,Arial,sans-serif}main{position:relative;z-index:1;width:min(760px,90%);margin:auto;padding:45px 0 75px}.top{display:flex;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}a{color:var(--silver);font-size:11px;letter-spacing:1.5px;text-decoration:none}.card{margin-top:45px;padding:30px;border:1px solid var(--line);border-radius:16px;background:rgba(7,11,15,.9)}.head{display:flex;align-items:center;gap:22px}.avatar{width:110px;height:110px;border-radius:50%;border:1px solid var(--line);object-fit:cover;background:#111}h1{margin:0;font:42px Cinzel,Georgia,serif;letter-spacing:3px}.status{margin-top:10px;color:#9fdda9;font:12px Orbitron,sans-serif}.offline{color:#9ba6ac}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}.item{padding:14px;border:1px solid var(--line);border-radius:8px;color:#b6c0c5;font:13px Arial,sans-serif}.item b{display:block;margin-bottom:5px;color:var(--silver);font:10px Orbitron,sans-serif;letter-spacing:1px}.clip{display:block;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:8px;color:var(--silver);font:13px Arial,sans-serif}@media(max-width:550px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}}
  </style>
</head>
<body>
  <main><header class="top"><a href="home.html">← BLACK VELVET HOME</a><a href="clips.html">CLIPS</a></header><section id="profile" class="card">Loading profile...</section></main>
  <script src="theme.js"></script>
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    const supabase=createClient("https://ptgzhljvzyceawwohmym.supabase.co","sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk"),box=document.getElementById("profile"),user=new URLSearchParams(location.search).get("user")||JSON.parse(localStorage.getItem("blackVelvetProfile")||"{}").username;
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function hex(){return localStorage.getItem("blackVelvetDeviceHex")||"UNKNOWN"}
    const {data:member}=await supabase.from("clan_members").select("*").ilike("username",user).maybeSingle();const {data:clips}=await supabase.from("clips").select("*").ilike("author_username",user).order("created_at",{ascending:false});
    if(!member){box.textContent="Player profile not found.";throw new Error("Profile not found")}
    const online=member.last_seen&&Date.now()-new Date(member.last_seen).getTime()<300000;
    box.innerHTML=`<div class="head"><img class="avatar" src="${esc(member.avatar_url||"https://placehold.co/150x150/111827/dce5eb?text=BV")}" onerror="this.src='https://placehold.co/150x150/111827/dce5eb?text=BV'"><div><h1>${esc(member.username)}</h1><div class="status ${online?"":"offline"}">${online?"● ONLINE":"● OFFLINE"}</div></div></div><div class="grid"><div class="item"><b>GAME</b>${esc(member.game)}</div><div class="item"><b>RANK</b>${esc(member.rank)} · #${esc(member.ranking_number||"N/A")}</div><div class="item"><b>HEX ID</b>${user===JSON.parse(localStorage.getItem("blackVelvetProfile")||"{}").username?esc(hex()):"PRIVATE"}</div><div class="item"><b>MEMBER SINCE</b>${new Date(member.created_at).toLocaleDateString()}</div></div><h2>POSTED CLIPS</h2>${(clips||[]).length?(clips||[]).map(c=>`<a class="clip" href="${esc(c.clip_url)}" target="_blank" rel="noopener">${esc(c.caption||"Untitled clip")} ↗</a>`).join(""):"<p>No clips posted yet.</p>"}`;
  </script>
</body>
</html>
