<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204">
  <title>Black Velvet | Clan Sign Up</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Orbitron,Arial,sans-serif}main{position:relative;z-index:1;width:min(680px,90%);margin:auto;padding:45px 0 75px}.top{display:flex;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}a{color:var(--silver);font-size:11px;letter-spacing:1.5px;text-decoration:none}.eyebrow{margin:58px 0 15px;color:var(--silver);font-size:11px;letter-spacing:3px}h1{margin:0;font-family:Cinzel,Georgia,serif;font-size:clamp(42px,8vw,75px);letter-spacing:4px}.intro{color:#aab5bc;font:16px/1.8 Arial,sans-serif}form{margin-top:28px;padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(7,11,15,.88)}label{display:block;margin:18px 0 8px;color:var(--silver);font-size:12px;font-weight:700;letter-spacing:1px}input,select{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:7px;outline:none;color:var(--text);background:#080c10;font:14px Arial,sans-serif}.hint{display:block;margin-top:7px;color:#84929a;font:12px Arial,sans-serif}.verification{display:none;overflow:hidden;margin-top:24px;padding:20px;border:1px solid rgba(220,230,236,.3);border-radius:10px;background:rgba(220,230,236,.04)}.verification.open,#clipArea.open{display:block}.verification h2{margin:0 0 8px;color:var(--silver);font:700 14px Orbitron,sans-serif;letter-spacing:1.5px}.verification p{margin:0 0 16px;color:#9eabb3;font:13px/1.6 Arial,sans-serif}.choice{display:flex;align-items:center;gap:10px;margin:10px 0;padding:13px;border:1px solid var(--line);border-radius:7px}.choice input{width:auto;margin:0}#clipArea{display:none}button{width:100%;margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:7px;color:#06080a;background:var(--silver);font:700 12px Orbitron,sans-serif;letter-spacing:2px;cursor:pointer}#message{min-height:22px;margin:16px 0 0;color:var(--silver);font:13px Arial,sans-serif;text-align:center}#message.error{color:#e7a4a4}
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a href="home.html">← BLACK VELVET HOME</a>
      <a href="member-login.html">MEMBER LOGIN</a>
    </header>

    <p class="eyebrow">BLACK VELVET // MEMBER APPLICATION</p>
    <h1>SIGN UP</h1>
    <p class="intro">Choose the game and rank you are applying for.</p>

    <form id="signupForm">
      <label>USERNAME<input name="username" maxlength="40" required></label>
      <label>PASSWORD<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
      <label>DISCORD USER<input name="discord" maxlength="80" required></label>

      <label>PROFILE PICTURE
        <input name="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <input name="avatarUrl" type="url" placeholder="Or paste an image URL">
        <span class="hint">Upload an image or paste an image URL. Maximum upload size: 10 MB.</span>
      </label>

      <label>GAME YOU ARE APPLYING FOR
        <select name="game" required>
          <option value="">SELECT A GAME</option>
          <option>Minecraft Java</option>
          <option>Minecraft Bedrock</option>
          <option>Valorant</option>
          <option>Fortnite</option>
          <option>Roblox</option>
          <option>Rocket League</option>
        </select>
      </label>

      <label>RANK YOU DESERVE
        <select id="rank" name="rank" required>
          <option value="BVR">BVR</option>
          <option value="Rookie">Rookie</option>
          <option value="Decent">Decent</option>
          <option value="Legend">Legend</option>
          <option value="Elite">Elite</option>
          <option value="Goat">Goat</option>
        </select>
      </label>

      <section id="verification" class="verification">
        <h2>RANK VERIFICATION REQUIRED</h2>
        <p>Select how staff should verify the requested rank.</p>
        <label class="choice"><input type="radio" name="verificationType" value="tryout"><span>PREFERRED TRYOUT</span></label>
        <label class="choice"><input type="radio" name="verificationType" value="clip"><span>SEND A CLIP</span></label>

        <div id="clipArea">
          <label>UPLOAD CLIP<input name="clipFile" type="file" accept="video/mp4,video/webm,video/quicktime"></label>
          <label>CLIP LINK<input id="clipUrl" name="clipUrl" type="url" placeholder="Or paste a YouTube, Twitch, Medal, or other clip link"></label>
          <span class="hint">Upload a video or provide one clip link. Maximum upload size: 100 MB.</span>
        </div>
      </section>

      <button type="submit">SUBMIT APPLICATION</button>
      <p id="message" role="alert"></p>
    </form>
  </main>

  <script src="theme.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase=createClient(
      "https://ptgzhljvzyceawwohmym.supabase.co",
      "sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk"
    );

    const form=document.getElementById("signupForm");
    const rank=document.getElementById("rank");
    const verification=document.getElementById("verification");
    const clipArea=document.getElementById("clipArea");
    const message=document.getElementById("message");

    async function hashPassword(password){
      const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(password));
      return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("");
    }

    function getDeviceHex(){
      let hex=localStorage.getItem("blackVelvetDeviceHex");

      if(!hex){
        const bytes=new Uint8Array(2);
        crypto.getRandomValues(bytes);
        hex=`D${Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase()}`;
        localStorage.setItem("blackVelvetDeviceHex",hex);
      }

      return hex;
    }

    async function getBan(username){
      const deviceHex=getDeviceHex();
      const {data,error}=await supabase.from("account_bans").select("*");

      if(error) throw error;

      return (data||[]).find(ban=>
        ban.username?.toLowerCase()===username.toLowerCase() ||
        (ban.device_hexes||[]).includes(deviceHex)
      );
    }

    function cleanName(name){
      return name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");
    }

    async function upload(file,folder,maxBytes){
      if(!file) return null;
      if(file.size>maxBytes) throw new Error(`${file.name} is too large.`);

      const path=`${folder}/${crypto.randomUUID()}-${cleanName(file.name)}`;
      const {error}=await supabase.storage
        .from("black-velvet-media")
        .upload(path,file,{upsert:false});

      if(error) throw error;

      return supabase.storage
        .from("black-velvet-media")
        .getPublicUrl(path).data.publicUrl;
    }

    function updateVerification(){
      const needed=rank.value!=="BVR";
      verification.classList.toggle("open",needed);

      if(!needed){
        form.querySelectorAll('[name="verificationType"]').forEach(input=>input.checked=false);
        clipArea.classList.remove("open");
      }
    }

    rank.addEventListener("change",updateVerification);

    form.querySelectorAll('[name="verificationType"]').forEach(input=>{
      input.addEventListener("change",()=>{
        clipArea.classList.toggle("open",input.checked&&input.value==="clip");
      });
    });

    form.addEventListener("submit",async event=>{
      event.preventDefault();

      const data=new FormData(form);
      const username=data.get("username").trim();
      const requestedRank=data.get("rank");
      const verificationType=data.get("verificationType");
      const avatarFile=data.get("avatarFile");
      const clipFile=data.get("clipFile");

      if(requestedRank!=="BVR"&&!verificationType){
        message.className="error";
        message.textContent="SELECT PREFERRED TRYOUT OR SEND A CLIP.";
        return;
      }

      if(verificationType==="clip"&&!clipFile?.name&&!data.get("clipUrl").trim()){
        message.className="error";
        message.textContent="UPLOAD A CLIP OR PROVIDE A CLIP LINK.";
        return;
      }

      message.className="";
      message.textContent="CHECKING ACCOUNT ACCESS...";

      try{
        const ban=await getBan(username);

        if(ban){
          localStorage.removeItem("blackVelvetProfile");
          localStorage.setItem("blackVelvetBanned","true");
          message.className="error";
          message.textContent="THIS USERNAME OR DEVICE IS BANNED FROM CREATING ACCOUNTS.";
          return;
        }

        localStorage.removeItem("blackVelvetBanned");

        const {data:existing,error:checkError}=await supabase
          .from("clan_member_applications")
          .select("id")
          .ilike("username",username)
          .limit(1);

        if(checkError||existing.length){
          message.className="error";
          message.textContent=checkError
            ? `Submission check failed: ${checkError.message}`
            : "AN APPLICATION FOR THIS USERNAME ALREADY EXISTS.";
          return;
        }

        message.textContent="TRANSMITTING APPLICATION...";

        const avatarUrl=avatarFile?.name
          ? await upload(avatarFile,"avatars",10*1024*1024)
          : data.get("avatarUrl").trim()||null;

        const uploadedClip=clipFile?.name
          ? await upload(clipFile,"application-clips",100*1024*1024)
          : null;

        const {error}=await supabase.from("clan_member_applications").insert({
          username,
          password_hash:await hashPassword(data.get("password")),
          discord_tag:data.get("discord").trim(),
          avatar_url:avatarUrl,
          game:data.get("game"),
          rank:requestedRank,
          preferred_tryout:verificationType==="tryout",
          clip_url:uploadedClip||data.get("clipUrl").trim()||null,
          status:"Pending"
        });

        if(error) throw error;

        form.reset();
        updateVerification();
        message.textContent="APPLICATION RECEIVED. STAFF WILL REVIEW IT.";
      }catch(error){
        message.className="error";
        message.textContent=`Submission failed: ${error.message}`;
      }
    });

    updateVerification();
  </script>
</body>
</html>
