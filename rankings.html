<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010204">
  <title>Black Velvet | Rankings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Orbitron, Arial, sans-serif;
      background-color: #010204;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(1040px, 90%);
      margin: auto;
      padding: 45px 0 75px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    a {
      color: var(--silver);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-decoration: none;
    }

    .eyebrow {
      margin: 58px 0 15px;
      color: var(--silver);
      font-size: 11px;
      letter-spacing: 3px;
    }

    h1, h2, h3 { font-family: Cinzel, Georgia, serif; }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 75px);
      letter-spacing: 4px;
    }

    .intro {
      color: #aab5bc;
      font: 16px/1.8 Arial, sans-serif;
    }

    .arcade-shell {
      position: relative;
      margin-top: 32px;
      padding: 20px;
      border: 2px solid #86959e;
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(29, 39, 48, .97), rgba(4, 7, 10, .98)),
        #070b0f;
      box-shadow:
        inset 0 0 0 3px #0b1116,
        inset 0 0 35px rgba(170, 203, 220, .07),
        0 0 28px rgba(187, 211, 224, .12);
    }

    .arcade-shell::before {
      content: "BLACK VELVET ARCADE // PLAYER RANKINGS";
      display: block;
      margin-bottom: 18px;
      color: #dce8ee;
      font: 9px/1.7 "Press Start 2P", monospace;
      text-align: center;
      text-shadow: 0 0 10px rgba(220, 232, 238, .55);
    }

    .game-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .game-tab {
      min-height: 70px;
      padding: 11px 9px;
      border: 2px solid #263640;
      border-radius: 7px;
      background: linear-gradient(180deg, #17222a, #091015);
      color: #9baab2;
      font: 8px/1.6 "Press Start 2P", monospace;
      cursor: pointer;
      transition: .18s ease;
    }

    .game-tab:hover,
    .game-tab.active {
      border-color: #d5e5ec;
      background: linear-gradient(180deg, #445660, #1a272f);
      color: #fff;
      box-shadow: inset 0 0 15px rgba(222, 240, 247, .18), 0 0 14px rgba(205, 228, 239, .18);
      text-shadow: 0 0 7px #fff;
    }

    .game-panel {
      position: relative;
      margin-top: 16px;
      min-height: 420px;
      padding: 28px;
      overflow: hidden;
      border: 2px solid #34444e;
      border-radius: 10px;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 4px),
        linear-gradient(135deg, #101a20, #05090d 70%);
    }

    .game-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(129, 189, 220, .05), transparent 25%, transparent 75%, rgba(129, 189, 220, .05));
    }

    .panel-label {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #91a9b5;
      font: 8px/1.6 "Press Start 2P", monospace;
      letter-spacing: 1px;
    }

    .game-panel h2 {
      position: relative;
      z-index: 1;
      margin: 13px 0 28px;
      color: #eef8fc;
      font: clamp(19px, 3vw, 31px)/1.4 "Press Start 2P", monospace;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 #24333b, 0 0 12px rgba(222, 242, 250, .38);
    }

    .leaderboard {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .rank-entry {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 74px;
      padding: 14px 16px;
      border: 2px solid #263640;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(29, 45, 54, .93), rgba(5, 10, 14, .92));
      box-shadow: inset 0 0 13px rgba(120, 167, 190, .06);
    }

    .rank-entry:nth-child(1) {
      border-color: #e0c879;
      background: linear-gradient(90deg, rgba(101, 82, 28, .42), rgba(13, 12, 7, .92));
    }

    .rank-entry:nth-child(2) { border-color: #aebdc6; }
    .rank-entry:nth-child(3) { border-color: #bc8d69; }

    .tier {
      color: #b9cbd4;
      font: 8px/1.6 "Press Start 2P", monospace;
      text-transform: uppercase;
    }

    .player-name {
      overflow: hidden;
      color: #f0f7fa;
      font: 11px/1.6 "Press Start 2P", monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 0 7px rgba(232, 247, 255, .25);
    }

    .rank-number {
      min-width: 70px;
      color: #e0edf2;
      font: 13px/1 "Press Start 2P", monospace;
      text-align: right;
    }

    .rank-entry:nth-child(1) .rank-number { color: #ffe89b; }
    .rank-entry:nth-child(2) .rank-number { color: #e0edf2; }
    .rank-entry:nth-child(3) .rank-number { color: #e5a982; }

    .empty {
      padding: 30px 0;
      color: #849da9;
      font: 10px/1.9 "Press Start 2P", monospace;
      text-align: center;
    }

    @media (max-width: 850px) {
      .game-tabs { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      main { width: min(94%, 1040px); }
      .arcade-shell { padding: 12px; }
      .game-tabs { grid-template-columns: repeat(2, 1fr); }
      .game-tab { min-height: 62px; font-size: 7px; }
      .game-panel { padding: 19px 13px; }
      .rank-entry { grid-template-columns: 1fr auto; gap: 9px; padding: 13px 11px; }
      .tier { grid-column: 1 / -1; }
      .player-name { font-size: 9px; }
      .rank-number { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a href="home.html">← BLACK VELVET HOME</a>
      <a href="clan-signup.html">SIGN UP</a>
    </header>

    <p class="eyebrow">BLACK VELVET // COMPETITIVE NETWORK</p>
    <h1>RANKINGS</h1>
    <p class="intro">Choose a game panel. Players automatically appear in order when staff assigns their ranking number.</p>

    <section class="arcade-shell">
      <nav id="gameTabs" class="game-tabs" aria-label="Game ranking panels"></nav>
      <section id="rankingPanel"></section>
    </section>
  </main>

  <script src="theme.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://ptgzhljvzyceawwohmym.supabase.co",
      "sb_publishable_H-6UMCfs6yyEG3JcBhETSg_sjr0aoVk"
    );

    const games = [
      "Minecraft Java",
      "Minecraft Bedrock",
      "Valorant",
      "Fortnite",
      "Rocket League"
    ];

    const rankOrder = { Goat: 0, Elite: 1, Legend: 2, Decent: 3, Rookie: 4, BVR: 5 };
    const tabs = document.getElementById("gameTabs");
    const panel = document.getElementById("rankingPanel");
    let activeGame = games[0];
    let allMembers = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function render() {
      tabs.innerHTML = games.map(game => `
        <button class="game-tab ${game === activeGame ? "active" : ""}" data-game="${escapeHtml(game)}">
          ${escapeHtml(game)}
        </button>
      `).join("");

      const members = allMembers
        .filter(member => member.game === activeGame && member.ranking_number)
        .sort((a, b) =>
          a.ranking_number - b.ranking_number ||
          (rankOrder[a.rank] ?? 99) - (rankOrder[b.rank] ?? 99)
        );

      panel.innerHTML = `
        <article class="game-panel">
          <p class="panel-label">SELECTED GAME // LIVE LEADERBOARD</p>
          <h2>${escapeHtml(activeGame)}</h2>
          <div class="leaderboard">
            ${members.length ? members.map(member => `
              <article class="rank-entry">
                <span class="tier">${escapeHtml((member.rank || "BVR").toUpperCase())}</span>
                <span class="player-name">${escapeHtml(member.username)}</span>
                <strong class="rank-number">#${escapeHtml(member.ranking_number)}</strong>
              </article>
            `).join("") : '<p class="empty">NO RANKED PLAYERS<br>ASSIGNED TO THIS GAME</p>'}
          </div>
        </article>
      `;
    }

    tabs.addEventListener("click", event => {
      const button = event.target.closest("[data-game]");
      if (!button) return;
      activeGame = button.dataset.game;
      render();
    });

    async function loadRankings() {
      const { data, error } = await supabase
        .from("clan_members")
        .select("username, game, rank, ranking_number");

      if (!error) {
        allMembers = data || [];
        render();
      }
    }

    await loadRankings();

    supabase.channel("ranking-updates")
      .on("postgres_changes", { event: "*", schema: "public", table: "clan_members" }, loadRankings)
      .subscribe();
  </script>
</body>
</html>
