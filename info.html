<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Clan — Information</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
        line-height: 1.6;
        position: relative;
    }

    .signature {
        position: absolute;
        top: 20px;
        right: 20px;
        font-family: 'Press Start 2P', cursive;
        font-size: 10px;
        color: #888;
        opacity: 0.8;
        text-align: right;
    }

    h1 {
        text-align: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 32px;
        margin-bottom: 30px;
        color: #ffffff;
        letter-spacing: 2px;
    }

    .info-box {
        max-width: 900px;
        margin: auto;
        background: #1a1a1a;
        padding: 40px;
        border-radius: 10px;
        border-left: 6px solid #ffffff;
        margin-bottom: 25px;
        text-align: center;
    }

    .soon {
        font-family: 'Press Start 2P', cursive;
        font-size: 22px;
        color: #ffffff;
        margin-top: 10px;
        letter-spacing: 3px;
    }

    .back-btn {
        display: block;
        width: 200px;
        margin: 40px auto;
        text-align: center;
        padding: 15px;
        background: #111;
        border: 2px solid #444;
        border-radius: 10px;
        font-family: 'Press Start 2P', cursive;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .back-btn:hover {
        border-color: #ffffff;
        background: #222;
        transform: scale(1.03);
    }
</style>
</head>

<body>
